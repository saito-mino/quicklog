<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quicklog</title>
<meta name="theme-color" content="#F4F5F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quicklog">
<style>
:root{
  --ink:#232A35;
  --paper:#F4F5F2;
  --card:#FFFFFF;
  --line:#E2E5DF;
  --sub:#78808F;
  --focus:#2F5FA8;
  --danger:#A84A3B;
  --ok:#2F7A50;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.6;
}
.num{font-family:"SF Mono",SFMono-Regular,Consolas,"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px 80px}

header{display:flex;align-items:baseline;justify-content:space-between;padding:10px 4px 14px}
.logo{font-weight:700;font-size:1.15rem;letter-spacing:.14em}
.logo small{font-weight:400;font-size:.66rem;color:var(--sub);letter-spacing:.05em;margin-left:8px}

/* 種類タブ(全面カラー) */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 0;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:4px}
.tab{flex:0 0 auto;border:none;color:#fff;
  border-radius:10px 10px 0 0;padding:9px 16px 11px;font-size:.86rem;cursor:pointer;position:relative;top:1px;white-space:nowrap;font-family:inherit;
  opacity:.45;font-weight:600}
.tab.active{opacity:1;font-weight:700;z-index:2}
.tab .del{display:none;margin-left:8px;color:#FFD9D9;font-weight:700}
.tab-add{flex:0 0 auto;display:none;border:1px dashed var(--sub);background:none;color:var(--sub);border-radius:10px 10px 0 0;padding:8px 12px 10px;font-size:.86rem;cursor:pointer;position:relative;top:1px;font-family:inherit}

/* 入力カード */
.entrycard{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:0 var(--radius) var(--radius) var(--radius);padding:16px 16px 14px;position:relative;z-index:1}
.field{margin-bottom:10px}
.field label{display:block;font-size:.72rem;color:var(--sub);letter-spacing:.08em;margin-bottom:3px}
input[type=text],input[type=number],textarea,select{
  border:1px solid var(--line);border-radius:8px;background:#FCFCFB;
  padding:9px 10px;font-size:16px;font-family:inherit;color:var(--ink)}
input[type=text],input[type=number],textarea{width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
textarea{resize:vertical;min-height:66px}
textarea.big{min-height:170px}
.date6{width:110px !important;letter-spacing:.08em}
.date6.bad{border-color:var(--danger);outline-color:var(--danger)}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .field{flex:1;min-width:0}
.row2 label{white-space:nowrap}
.row2 .selrow{flex-wrap:nowrap}
.row2 .selrow button{padding:6px 8px;font-size:.8rem;white-space:nowrap}
.row2 .date6{width:100% !important;min-width:0}
.row2.tight{gap:8px}
.row2.tight .field{flex:0 1 auto;margin-bottom:8px}
.row2.tight label{font-size:.62rem;margin-bottom:2px}
.row2.tight .date6{width:84px !important;padding:7px 6px;font-size:14px;letter-spacing:.05em}
.row2.tight .statline{gap:8px}
.row2.tight .statline select{padding:7px 8px;font-size:.85rem;min-width:0}
.datepreview{font-size:.72rem;color:var(--sub);margin-left:10px}
.personbtn{width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:#FCFCFB;padding:9px 10px;font-size:16px;cursor:pointer;color:var(--ink);font-family:inherit}
.personbtn.empty{color:#A9AFB9;min-height:38px}
/* 複数人選択(チップ+追加) */
.plchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plchip{border:1px solid var(--line);background:#F6F7F5;border-radius:16px;padding:5px 12px;font-size:.88rem;font-family:inherit}
.plchip .rm{margin-left:8px;color:var(--danger);font-weight:700;cursor:pointer}
.pladd{border:1px dashed var(--sub);background:none;color:var(--sub);border-radius:16px;padding:5px 14px;font-size:.88rem;cursor:pointer;font-family:inherit}
/* ワンタップ選択(チップ) */
.selrow{display:flex;gap:6px;flex-wrap:wrap}
.selrow button{border:1px solid var(--line);background:#FCFCFB;border-radius:8px;padding:8px 14px;font-size:.9rem;cursor:pointer;color:var(--sub);font-family:inherit}
.selrow button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.selrow button.on.io-in{background:var(--ok);border-color:var(--ok)}
.selrow button.on.io-out{background:var(--danger);border-color:var(--danger)}
.selrow button.on.prio-a{background:#E0AA00;border-color:#E0AA00;color:#232A35}
.selrow button.on.prio-b{background:#7B5EA7;border-color:#7B5EA7}
.selrow button.on.prio-c{background:#8A93A6;border-color:#8A93A6}
.selrow button.on.mk-rec{background:#5F7F5F;border-color:#5F7F5F}
.badge.brecipe{background:#E7F0D8;border-color:#9DBA7F;color:#232A35;font-weight:700}
/* 写真(v65) */
.phrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.phbox{position:relative;display:inline-block}
.phthumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#F0F1EE;display:block}
.phbox .phx{position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:.8rem;cursor:pointer;line-height:1;padding:0}
.phadd{border:1px dashed var(--sub);background:none;color:var(--sub);border-radius:8px;padding:14px 16px;font-size:.9rem;cursor:pointer;font-family:inherit}
.dphoto{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:4px 0;display:block;background:#F0F1EE;min-height:60px}
.selrow button.addopt{border:1px dashed var(--sub);background:none;color:var(--sub);padding:8px 12px}
/* 時間ワンタップ */
.minrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.minrow input{width:120px;flex:0 0 auto}
.minrow .unit{font-size:.8rem;color:var(--sub);margin-right:4px}
.minrow button{border:1px solid var(--line);background:#FCFCFB;border-radius:8px;padding:8px 10px;font-size:.85rem;cursor:pointer;font-family:inherit;color:var(--ink)}
/* 省スペース型ステータス行(プルダウン+日付) */
.seikyu-sum{padding:10px 14px;margin-bottom:10px;border:1px solid var(--line,#ddd);border-radius:10px;font-weight:700;background:rgba(176,137,69,.08)}
.seikyu-sum .zan-red{color:#C0392B}
.seikyu-sum .zan-ok{color:#1E8449}
.statline{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.statline .sl{min-width:0}
.statline label{display:block;font-size:.7rem;color:var(--sub);letter-spacing:.08em;margin-bottom:3px}
.statline select{padding:8px 10px;font-size:.92rem;font-weight:700;border-radius:8px;cursor:pointer;color:#fff;min-width:0}
.statline select.neg{background:var(--danger);border-color:var(--danger)}
.statline select.hold{background:#8A93A6;border-color:#8A93A6}
.statline select.pos{background:var(--ok);border-color:var(--ok)}
.statline select option{background:#fff;color:var(--ink);font-weight:400}
.savebtn{width:100%;border:none;border-radius:8px;padding:13px;font-size:1rem;font-weight:700;color:#fff;cursor:pointer;letter-spacing:.2em;margin-top:2px;font-family:inherit}
.editing-note{font-size:.75rem;color:var(--focus);margin-bottom:8px;display:none}

/* ツールバー・一覧 */
.toolbar{display:flex;gap:8px;margin:18px 0 10px}
.toolbar input{flex:1}
.copyall{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 14px;font-size:.85rem;cursor:pointer;color:var(--ink);font-family:inherit}
.filterrow{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:5px 14px;font-size:.82rem;cursor:pointer;color:var(--sub);font-family:inherit}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.hint{font-size:.72rem;color:var(--sub);margin-bottom:10px;padding:0 2px}
.timeline{display:flex;flex-direction:column;gap:10px}
.rec{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer}
.rec:hover{border-color:var(--sub)}
.rec .tabmark{flex:0 0 8px}
.rec .body{padding:10px 14px;flex:1;min-width:0}
.rec .qdone{flex:0 0 auto;align-self:stretch;min-width:52px;border:none;border-left:1px solid var(--line);background:transparent;color:var(--ok);font-size:.74rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 8px}
.rec .qdone span{font-size:1.05rem;line-height:1}
.rec .qdone:active{background:var(--ok);color:#fff}
.ddsel{width:100%;padding:9px 10px;font-size:.95rem;font-weight:700;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.rec .meta{display:flex;gap:10px;align-items:baseline;font-size:.74rem;color:var(--sub);margin-bottom:2px;flex-wrap:wrap}
.rec .cat{font-weight:700;color:var(--ink)}
.badge{font-size:.68rem;border:1px solid var(--line);border-radius:10px;padding:0 8px;color:var(--sub);background:#F6F7F5}
.badge.bred{color:#fff;border-color:var(--danger);background:var(--danger);font-weight:700}
.badge.bgreen{color:#fff;border-color:var(--ok);background:var(--ok);font-weight:700}
.badge.bgray{color:#fff;border-color:#8A93A6;background:#8A93A6;font-weight:700}
.bpill.gray{background:#8A93A6}
.badge.pa{color:#232A35;border-color:#E0AA00;background:#F2CE55;font-weight:700}
.badge.tapx{cursor:pointer;padding:2px 10px}
.badge.pb{color:#fff;border-color:#7B5EA7;background:#7B5EA7;font-weight:700}
.rec .txt{font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.amt-in{color:var(--ok);font-weight:700}
.amt-out{color:var(--danger);font-weight:700}
.empty-timeline{color:var(--sub);font-size:.85rem;text-align:center;padding:30px 0}
.ver{font-size:.62rem;color:var(--sub);font-weight:700;margin-left:6px;letter-spacing:.05em}
.durrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.durlbl{font-size:.68rem;color:var(--sub);font-weight:700}
.durrow button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:.78rem;cursor:pointer;font-family:inherit;color:var(--sub)}
.durrow button.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.morebtn{width:100%;border:1px dashed var(--sub);background:none;border-radius:10px;padding:12px;font-size:.85rem;color:var(--sub);cursor:pointer;font-family:inherit;margin-top:4px}
#kanriBanner{margin:0 0 10px;padding:10px 14px;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;line-height:1.5}
#kanriBanner.soon{background:#FFF6DC;color:#7A5C00;border:1px solid #E0AA00}
#kanriBanner.over{background:#FBE3E3;color:#8A1F1F;border:1px solid var(--danger)}
#kanriDash{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px;margin-bottom:14px;border-top:4px solid #1F5C5C}
.kd-title{font-size:.78rem;font-weight:700;color:var(--sub);margin-bottom:8px}
.kd-row{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:var(--card)}
.kd-row.kd-over{background:#FBE3E3;border-color:var(--danger)}
.kd-row.kd-soon{background:#FFF6DC;border-color:#E0AA00}
.kd-main{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.kd-days{font-weight:800;font-size:.92rem;min-width:70px}
.kd-over .kd-days{color:var(--danger)}
.kd-sub{color:var(--sub);font-size:.78rem;white-space:nowrap}
.kd-donerow{opacity:.55}
.kd-donerow .kd-days{color:var(--ok)}
.kd-toggle{float:right;font-size:.72rem;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--sub);cursor:pointer}
textarea.big.oneline{min-height:46px;height:46px;transition:height .15s ease}
textarea.big.oneline.expanded{height:240px;min-height:240px}
.kd-soon .kd-days{color:#7A5C00}
.kd-date{font-size:.78rem;color:var(--sub)}
.kd-cust{font-weight:700;font-size:.9rem}
.kd-kind{font-size:.88rem}
.kd-exp{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.8rem;color:var(--sub)}
.kd-donebtn{margin-top:8px;border:1px solid var(--ok);background:var(--ok);color:#fff;border-radius:8px;padding:7px 14px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit}
.dlrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.dlrow .dn{flex:1;min-width:0}
.dlrow .dd{width:92px !important}
.dlrow .dr{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font-size:.78rem;cursor:pointer;font-family:inherit;color:var(--sub);white-space:nowrap}
.dlrow .dr.on{background:#1F5C5C;border-color:#1F5C5C;color:#fff;font-weight:700}
.dlrow .dx{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 11px;font-size:.85rem;cursor:pointer;font-family:inherit;color:var(--danger)}
.dladd{border:1px dashed var(--sub);background:none;border-radius:8px;padding:8px 14px;font-size:.82rem;color:var(--sub);cursor:pointer;font-family:inherit}

/* オーバーレイ */
.overlay{display:none;position:fixed;inset:0;background:rgba(35,42,53,.45);z-index:50;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px 30px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px;max-height:80vh}}
.sheet h3{font-size:.95rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.closebtn{border:none;background:none;font-size:1.3rem;color:var(--sub);cursor:pointer;padding:0 4px}

/* 自作ダイアログ(入力・確認) */
.dlg-overlay{display:none;position:fixed;inset:0;background:rgba(35,42,53,.5);z-index:80;align-items:center;justify-content:center;padding:20px}
.dlg-overlay.open{display:flex}
.dlg{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:400px}
.dlg .dt{font-size:.92rem;font-weight:700;margin-bottom:12px;white-space:pre-wrap}
.dlg input{margin-bottom:14px}
.dlg .dbtns{display:flex;gap:8px}
.dlg .dbtns button{flex:1;border:1px solid var(--line);background:#F6F7F5;border-radius:8px;padding:11px;font-size:.92rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.dlg .dbtns button.primary{background:var(--focus);border-color:var(--focus);color:#fff;font-weight:700}
.dlg .dbtns button.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}

/* 人物ピッカー */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#F6F7F5;border-radius:16px;padding:4px 12px;font-size:.85rem;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--focus);color:var(--focus)}
.grouptabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.gtab{flex:0 0 auto;border:1px solid var(--line);background:#F6F7F5;border-radius:8px;padding:5px 12px;font-size:.83rem;cursor:pointer;white-space:nowrap;font-family:inherit}
.gtab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.gtab .del{display:none;margin-left:6px;color:#FFB3B3;font-weight:700}
.gtab-add{flex:0 0 auto;border:1px dashed var(--sub);background:none;border-radius:8px;padding:5px 10px;font-size:.83rem;cursor:pointer;color:var(--sub);font-family:inherit}
.plist{display:flex;flex-direction:column}
.plist button{text-align:left;border:none;border-bottom:1px solid var(--line);background:none;padding:11px 6px;font-size:.95rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.plist button:hover{background:#F6F7F5}
.prow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.prow .pname{flex:1;text-align:left;border:none;background:none;padding:11px 6px;font-size:.95rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.prow .pname:hover{background:#F6F7F5}
.prow .pedit{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;background:#F6F7F5;font-size:.72rem;padding:4px 10px;color:var(--sub);cursor:pointer;font-family:inherit;margin-left:6px}
.paddrow{display:flex;gap:8px;margin-top:12px}
.paddrow input{flex:1}
.paddrow button{flex:0 0 auto;border:1px solid var(--focus);color:var(--focus);background:none;border-radius:8px;padding:0 14px;font-size:.85rem;cursor:pointer;font-family:inherit}
.picker-section-label{font-size:.7rem;color:var(--sub);letter-spacing:.1em;margin-bottom:5px}

/* 詳細 */
.detail-tab{height:8px;border-radius:8px 8px 0 0;margin:-18px -18px 14px}
.detail-cat{font-size:1.05rem;font-weight:700;margin-bottom:2px}
.detail-meta{font-size:.78rem;color:var(--sub);margin-bottom:14px}
.dl{margin-bottom:12px}
.dl .k{font-size:.7rem;color:var(--sub);letter-spacing:.08em}
.dl .v{font-size:.95rem;white-space:pre-wrap;word-break:break-word}
.bpill{display:inline-block;font-size:.9rem;font-weight:700;letter-spacing:.1em;color:#fff;border-radius:8px;padding:4px 14px;margin:2px 6px 2px 0}
.bpill.red{background:var(--danger)}
.bpill.green{background:var(--ok)}
.bpill.fy{background:#E0AA00;color:#232A35}
.bpill.fp{background:#7B5EA7}
.detail-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.detail-actions button{flex:1 1 40%;border:1px solid var(--line);background:#F6F7F5;border-radius:8px;padding:11px;font-size:.88rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.detail-actions button.danger{color:var(--danger);border-color:#E5C9C9}

#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#2E9E6B;color:#fff;padding:14px 26px;border-radius:14px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:92vw;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--danger)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">QUICKLOG<span class="ver" id="appVer"></span><small id="syncStat">起動中…</small></div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div id="kanriBanner" style="display:none"></div>
  <div class="entrycard" id="entrycard">
    <div class="editing-note" id="editingNote">▶ 既存の記録を編集中です(保存で上書き)</div>
    <div id="fields"></div>
    <button class="savebtn" id="saveBtn" onclick="saveEntry()">保 存</button>
  </div>

  <div id="kanriDash" style="display:none"></div>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="キーワード検索(全タブから探します)" oninput="searchInput()">
    <button class="copyall" onclick="copyAll()">全件コピー</button>
  </div>
  <div class="filterrow">
    <button class="fbtn" id="fb_urg" onclick="toggleUrg()">緊急</button>
    <button class="fbtn" id="fb_imp" onclick="toggleImp()">不急</button>
    <button class="fbtn" id="fb_done" onclick="toggleDone()">完了を含む</button>
    <button class="fbtn" id="fb_hold" onclick="toggleHold()">保留</button>
    <button class="fbtn" id="fb_arch" onclick="toggleArch()">アーカイブ</button>
    <button class="fbtn" id="fb_anken" onclick="openAnkenFilter()">案件</button>
    <button class="fbtn" id="fb_bill" onclick="toggleBill()">未請求</button>
    <button class="fbtn" id="fb_pay" onclick="togglePay()">未入金</button>
  </div>

  <div class="timeline" id="timeline"></div>
</div>

<!-- 人物ピッカー -->
<div class="overlay" id="pickerOverlay" onclick="if(event.target===this)closePicker()">
  <div class="sheet">
    <h3><span id="pickerTitle">人物を選択</span><button class="closebtn" onclick="closePicker()">×</button></h3>
    <input type="text" id="pickerSearch" placeholder="名前で検索(全分野から絞り込み)" oninput="renderPickerList()" style="margin-bottom:12px">
    <div id="recentWrap">
      <div class="picker-section-label">最近使った人</div>
      <div class="chips" id="recentChips"></div>
    </div>

<script>
/* =============================================================
   タブ定義(設計図)。部品type:
   date6 / person / personlist(複数人・＋追加) / text / textarea /
   bigtext / amount / minutes / select(extendable対応) /
   statline(省スペース型ステータス: プルダウン+日付欄)
   ============================================================= */
const PALETTE=['#3B6FB5','#7B5EA7','#5F7F5F','#9E5E8A','#A84A3B','#4E6E9E','#8A7A3B','#2E8B8B','#3E8E5F','#C08427','#B05A6E'];

/* =============== 同期レイヤー(GAS+スプレッドシート) =============== */
const GAS_URL='https://script.google.com/macros/s/AKfycbygSxlsQ310UIm1yG9RbnB2lcvJZ_zFxoFhbboTIsoUnjWxlDFx499tn_BlhDl-x5R3/exec';
const APP_VER='v65';
const LS_KEY='ql_key', LS_CACHE='ql_cache_v32', LS_OUTBOX='ql_outbox_v1';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let apiKey=lsGet(LS_KEY)||'';
let outbox=[];try{outbox=JSON.parse(lsGet(LS_OUTBOX)||'[]')||[]}catch(e){outbox=[]}
/* ---- 写真の送信待ち(v65)。記録本体とは別レーンにして、写真の失敗が記録の同期を止めないようにする ---- */
const LS_IMGBOX='ql_imgbox_v1';
let imgbox=[];try{imgbox=JSON.parse(lsGet(LS_IMGBOX)||'[]')||[]}catch(e){imgbox=[]}
function saveImgbox(){lsSet(LS_IMGBOX,JSON.stringify(imgbox))}
function imgEnqueue(id,data){imgbox.push({id:id,data:data});saveImgbox();updStat();imgFlush()}
let imgFlushing=false;
async function imgFlush(){
  if(imgFlushing||!imgbox.length||!apiKey)return;
  imgFlushing=true;
  while(imgbox.length){
    const op=imgbox[0];
    try{
      const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({key:apiKey,action:'imgup',id:op.id,data:op.data})});
      const j=await res.json();
      if(j&&j.ok){imgbox.shift();saveImgbox();updStat()}
      else break; /* GAS未対応・エラー時はここで止め、30秒ごとに自動再送 */
    }catch(e){break}
  }
  imgFlushing=false;updStat();
}
const photoCache={}; /* 表示用: 取得済み写真(このセッションの間だけ記憶) */
let photoData={};    /* 選んだ直後の写真(送信前プレビュー用) */
async function loadPhoto(id){
  if(photoData[id])return photoData[id];
  if(photoCache[id])return photoCache[id];
  const pend=imgbox.find(o=>o.id===id);
  if(pend)return pend.data;
  if(!apiKey)return null;
  try{
    const res=await fetch(GAS_URL+'?key='+encodeURIComponent(apiKey)+'&img='+encodeURIComponent(id));
    const j=await res.json();
    if(j&&j.ok&&j.data){photoCache[id]=j.data;return j.data}
  }catch(e){}
  return null;
}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
/* ---- 通し番号(v64)。番号は指紋であって分類ではない: 一度振ったら統合・タブ移動でも不変、再利用しない ---- */
const NO_PREFIX={task:'T',kanri:'K',jikan:'J',shukan:'S',pf:'M',shushi:'F',anken:'A',bukken:'B',neta:'N',hiyari:'H',genkin:'Z'};
function parseNo(s){const m=/^([A-Z])-(\d+)$/.exec(String(s||''));return m?{p:m[1],n:+m[2]}:null}
function issueNo(cat){
  const p=NO_PREFIX[cat];if(!p)return'';
  let mx=0;
  entries.forEach(en=>{const m=parseNo(en.no);if(m&&m.p===p&&m.n>mx)mx=m.n});
  return p+'-'+(mx+1);
}
function saveLocal(){
  lsSet(LS_CACHE,JSON.stringify({entries:entries,cats:cats,groups:groups,recentPeople:recentPeople}));
  lsSet(LS_OUTBOX,JSON.stringify(outbox));
}
function loadLocal(){
  try{
    let c=JSON.parse(lsGet(LS_CACHE)||'null');
    if(!c){
      /* 旧バージョンのキャッシュから記録・人物リストだけ引き継ぐ(タブ構成は新定義を使う) */
      const old=JSON.parse(lsGet('ql_cache_v31')||lsGet('ql_cache_v30')||lsGet('ql_cache_v29')||lsGet('ql_cache_v28')||lsGet('ql_cache_v27')||lsGet('ql_cache_v26')||lsGet('ql_cache_v25')||lsGet('ql_cache_v24')||lsGet('ql_cache_v23')||lsGet('ql_cache_v22')||lsGet('ql_cache_v21')||lsGet('ql_cache_v20')||lsGet('ql_cache_v19')||lsGet('ql_cache_v18')||lsGet('ql_cache_v17')||lsGet('ql_cache_v16')||lsGet('ql_cache_v15')||lsGet('ql_cache_v14')||lsGet('ql_cache_v13')||lsGet('ql_cache_v12')||lsGet('ql_cache_v11')||lsGet('ql_cache_v10')||lsGet('ql_cache_v9')||lsGet('ql_cache_v8')||lsGet('ql_cache_v7')||lsGet('ql_cache_v6')||lsGet('ql_cache_v5')||lsGet('ql_cache_v4')||lsGet('ql_cache_v3')||lsGet('ql_cache_v1')||'null');
      if(old)c={entries:old.entries,groups:old.groups,recentPeople:old.recentPeople};
    }
    if(c){
      if(Array.isArray(c.entries))entries=c.entries;
      /* v62: タブ・入力欄の定義(cats)は常にコード側の最新を使う(保存値で上書きすると新機能の欄が出ない) */
      if(Array.isArray(c.groups)&&c.groups.length)groups=c.groups;
      if(Array.isArray(c.recentPeople))recentPeople=c.recentPeople;
    }
  }catch(e){}
}
/* ---- 一括改修v3の自動移行 ---- */
function migrate(){
  /* 誤って作られた「5」という名前のタブを自動削除 */
  if(cats.some(c=>c.name==='5')){
    cats=cats.filter(c=>c.name!=='5');
    cfgSync();
  }
  const ren={'行政書士':'行政','宅建業':'宅建','他士業':'士業','法人顧客':'業者','個人顧客':'一般','法人':'業者','個人':'一般'};
  let g=false;
  groups.forEach(x=>{if(ren[x.name]){x.name=ren[x.name];g=true}});
  if(g)cfgSync();
  entries.forEach(en=>{
    if(en.cat==='bukken'&&!en.data.deal)en.data.deal='買い';
    if(en.cat==='hiyari'&&en.data&&en.data.taisaku){
      en.data.content=(en.data.content||'')+'\n【対策】'+en.data.taisaku;
      delete en.data.taisaku;
      enqueue({action:'save',entry:en,cols:colsOf(en)},true);
    }
    if(en.cat==='pf'&&en.data&&!en.data.date&&en.ts){
      const t=new Date(en.ts);
      if(!isNaN(t)){
        en.data.date=String(t.getFullYear()).slice(2)+pad2(t.getMonth()+1)+pad2(t.getDate());
        enqueue({action:'save',entry:en,cols:colsOf(en)},true);
      }
    }
    if(en.cat==='orei')en.cat='pf'; /* 御恩タブ廃止: 既存記録はメモへ */
    if(en.cat==='recipe'){en.cat='pf';en.data=en.data||{};if(!en.data.money)en.data.money='レシピ'} /* v63: レシピタブ廃止→レシピマーク付きメモへ */
    if(en.cat==='pf'&&en.data){
      if(en.data.money==='請求')en.data.money='請求済み';
      if(en.data.money==='入金')en.data.money='入金済み';
    }
    if(en.cat==='shukan'&&en.data){
      if(en.data.kind==='DASH')en.data.kind='ダッシュ';
      if(en.data.kind==='積み立て')en.data.kind='積立';
    }
    if(en.cat==='risk'){
      en.cat='task';
      const d=en.data;
      d.doneStat=(d.status==='対応済')?'完了':'未完了';
      if(d.doneStat==='完了'&&!d.doneDate)d.doneDate=d.date||today6();
      d.content=[d.content,d.idea].filter(Boolean).join('\n');
      delete d.status;delete d.idea;
    }
    const d=en.data;
    /* 廃止した備考の中身を内容欄へ併合(見えなくならないように) */
    if(['task','shukan'].includes(en.cat)&&d.note){d.content=[d.content,d.note].filter(Boolean).join('\n');delete d.note}
    if(['jikan','shushi'].includes(en.cat)&&d.note){d.content=[d.content,d.note].filter(Boolean).join(' / ');delete d.note}
    if(en.cat==='bukken'&&d.note){d.free=[d.free,d.note].filter(Boolean).join('\n');delete d.note}
    /* 旧A〜D区分を緊急・重要フラグへ変換 */
    if(typeof d.prio==='string'){
      d.prio=({'A群':['緊急','重要'],'B群':['緊急'],'C群':['重要'],'D群':[]})[d.prio]||[];
    }
    /* v61: 区分を「緊急」「不急」の2択へ(重要・なしは不急に統合) */
    if(Array.isArray(d.prio)&&d.prio.length&&!(d.prio.length===1&&(d.prio[0]==='緊急'||d.prio[0]==='不急'))){
      d.prio=d.prio.includes('緊急')?['緊急']:['不急'];
    }
  });
  /* v60: 請求タブのシンプルログ化(旧ステータス・請求日/入金日・金額(報酬)欄を発生日+金額2欄+備考へ統合) */
  function seikyuV60Needed(d){return ('billStat' in d)||('payStat' in d)||('billDate' in d)||('payDate' in d)||('amount' in d)}
  function seikyuV60Convert(d){
    const has=v=>v!==''&&v!==undefined&&v!==null;
    const bAmt=has(d.billAmt)?d.billAmt:'';
    const pAmt=has(d.payAmt)?d.payAmt:'';
    const bD=valid6(d.billDate||'')?d.billDate:'';
    const pD=valid6(d.payDate||'')?d.payDate:'';
    const notes=[];
    if(has(d.amount)){const n=Number(d.amount);notes.push('【金額】'+(isNaN(n)?String(d.amount):n.toLocaleString('ja-JP'))+'円')}
    if(d.billStat==='請求済み'&&bAmt===''&&!bD)notes.push('【旧: 請求済み】');
    if(d.payStat==='入金済み'&&pAmt===''&&!pD)notes.push('【旧: 入金済み】');
    const base={anken:(typeof d.anken==='string')?d.anken:'',doneKeys:Array.isArray(d.doneKeys)?d.doneKeys:[]};
    if(d.srcAnken!==undefined)base.srcAnken=d.srcAnken;
    if(bAmt!==''&&pAmt!==''&&bD&&pD&&bD!==pD){
      const main=Object.assign({},base,{date:d.date||bD,billAmt:bAmt,payAmt:''});
      if(bD&&main.date!==bD)notes.push('請求日: '+iso6(bD));
      main.note=[d.note,...notes].filter(Boolean).join('\n');
      const extra=Object.assign({},base,{date:pD,billAmt:'',payAmt:pAmt,note:'',doneKeys:[]});
      return {main:main,extra:extra};
    }
    const main=Object.assign({},base,{date:d.date||bD||pD||'',billAmt:bAmt,payAmt:pAmt});
    if(bD&&main.date!==bD)notes.push('請求日: '+iso6(bD));
    if(pD&&main.date!==pD)notes.push('入金日: '+iso6(pD));
    main.note=[d.note,...notes].filter(Boolean).join('\n');
    return {main:main,extra:null};
  }
  /* 案件に残っている請求・入金・金額データを、請求タブの記録として一度だけ引っ越す */
  const newSeikyu=[];
  entries.forEach(en=>{
    if(en.cat!=='anken'||!en.data)return;
    const ad=en.data;
    const hasBill=!!ad.billStat||valid6(ad.payDate||'')||ad.payStat==='入金済み'||(ad.amount!==''&&ad.amount!==undefined&&ad.amount!==null);
    if(!hasBill)return;
    if(entries.some(x=>x.cat==='seikyu'&&x.data&&String(x.data.srcAnken)===String(en.id)))return;
    newSeikyu.push({id:uid(),cat:'seikyu',ts:en.ts||Date.now(),data:{
      date:ad.date||'',
      billStat:ad.billStat||'未請求',billAmt:'',billDate:'',
      payStat:ad.payStat||'未入金',payAmt:'',payDate:ad.payDate||'',
      anken:ankenLabel(en),amount:(ad.amount!==undefined&&ad.amount!==null)?ad.amount:'',
      srcAnken:en.id,note:'',doneKeys:[]}});
  });
  newSeikyu.forEach(x=>{entries.unshift(x);enqueue({action:'save',entry:x,cols:colsOf(x)},true)});
  /* v60移行の実行: 全請求レコードを新形式へ。日付違いの請求+入金は2行に分割 */
  const seikyuExtra=[];const seikyuEmpty=[];
  entries.forEach(en=>{
    if(en.cat!=='seikyu'||!en.data||!seikyuV60Needed(en.data))return;
    const r=seikyuV60Convert(en.data);
    en.data=r.main;
    enqueue({action:'save',entry:en,cols:colsOf(en)},true);
    if(r.extra)seikyuExtra.push({id:uid(),cat:'seikyu',ts:en.ts||Date.now(),data:r.extra});
    if(!en.arch&&r.main.billAmt===''&&r.main.payAmt===''&&!r.main.note)seikyuEmpty.push(en);
  });
  seikyuExtra.forEach(x=>{entries.unshift(x);enqueue({action:'save',entry:x,cols:colsOf(x)},true)});
  if(seikyuEmpty.length){
    setTimeout(()=>{askConfirm('請求タブの整理で、金額もメモも入っていない空の請求記録が'+seikyuEmpty.length+'件見つかりました。まとめてアーカイブしますか?(データは消えません。「アーカイブ」フィルターでいつでも見られます)','アーカイブする',()=>{
      seikyuEmpty.forEach(x=>{x.arch=1;enqueue({action:'save',entry:x,cols:colsOf(x)},true)});
      saveLocal();flush();renderTimeline();toast(seikyuEmpty.length+'件をアーカイブしました');
    })},800);
  }
  /* 管理カルテの一本化: 旧形式は直接変換、業務別に分かれたカルテは顧客ごとに合体 */
  const BIZMAP={'会計':'会計','建設業許可':'建設','産廃業許可':'産廃','宅建業許可':'宅建','ビザ申請':'ビザ','法定後見':'後見','任意後見':'後見'};
  const MERGEK=['htype','kessan','sales1','sales2','sales3','capital','shares','est','kaigyo','aoiro','kazei','honsoku','kyoka','kyoka_no','sanpai','sanpai_no','takken','takken_no','takkenshi','zairyu','zexp','toritsugi','bday','souzoku','startd'];
  const groupsK={};
  entries.forEach(en=>{
    if(en.cat!=='kanri'||!en.data)return;
    const ad=en.data;
    if(Array.isArray(ad.bizs))return; /* 新形式 */
    if(ad.mergedInto)return; /* 合体済みの控え */
    if(!ad.biz){
      /* v39/v46形式 → その場で新形式へ */
      const bz=[];
      const isIppan=(ad.gtype==='一般')||(!ad.gtype&&ad.ktype==='個人');
      if(!isIppan||valid_md4(ad.kessan||'')||!!ad.sales1||!!ad.sales2||!!ad.sales3)bz.push('会計');
      if(valid6(ad.kyoka||''))bz.push('建設');
      if(valid6(ad.takken||'')||valid6(ad.takkenshi||''))bz.push('宅建');
      if(valid6(ad.zexp||'')||ad.zairyu||valid6(ad.toritsugi||''))bz.push('ビザ');
      if(ad.koken==='あり'||valid_ymd8(ad.bday||''))bz.push('後見');
      ad.bizs=bz;
      if(!ad.htype)ad.htype=isIppan?'個人':'法人';
      if(ad.permits&&!ad.kyoka_no)ad.kyoka_no=ad.permits;
      if(bz.includes('後見')&&!ad.kkind)ad.kkind='不明';
      ['permits','gtype','ktype','staff','koken'].forEach(k=>delete ad[k]);
      enqueue({action:'save',entry:en,cols:colsOf(en)},true);
      return;
    }
    const pk=ad.partner||('(無名)'+en.id);
    (groupsK[pk]=groupsK[pk]||[]).push(en);
  });
  Object.keys(groupsK).forEach(pk=>{
    const arr=groupsK[pk].sort((a,b)=>((a.data.srcKanri?1:0)-(b.data.srcKanri?1:0))||((a.ts||0)-(b.ts||0)));
    const main=arr[0],md=main.data,bz=[];
    const absorb=ad=>{
      const b=BIZMAP[ad.biz];if(b&&!bz.includes(b))bz.push(b);
      MERGEK.forEach(k=>{if((md[k]===undefined||md[k]==='')&&ad[k]!==undefined&&ad[k]!=='')md[k]=ad[k]});
      if(ad.biz==='法定後見'){md.kkind='法定後見';if(ad.kaishi&&!md.startd)md.startd=ad.kaishi}
      if(ad.biz==='任意後見'){if(!md.kkind)md.kkind='任意後見';if(ad.keiyakubi&&!md.startd)md.startd=ad.keiyakubi}
      if(ad!==md&&ad.note)md.note=(md.note?md.note+'\n':'')+ad.note;
      if(Array.isArray(ad.doneKeys))md.doneKeys=Array.from(new Set([].concat(md.doneKeys||[],ad.doneKeys)));
    };
    absorb(md);
    arr.slice(1).forEach(x=>{absorb(x.data);x.arch=true;x.data.mergedInto=String(main.id);enqueue({action:'save',entry:x,cols:colsOf(x)},true)});
    md.bizs=sortFlags(bz);
    if(bz.includes('後見')&&!md.kkind)md.kkind='不明';
    delete md.biz;delete md.srcKanri;delete md.kaishi;delete md.keiyakubi;
    enqueue({action:'save',entry:main,cols:colsOf(main)},true);
  });
  /* v64: 通し番号の付与。未採番の記録に作成順(ts昇順)で振る。重複番号は新しい方だけ振り直して修復 */
  const maxNo={},seenNo={};
  entries.forEach(en=>{const m=parseNo(en.no);if(m&&(!maxNo[m.p]||m.n>maxNo[m.p]))maxNo[m.p]=m.n});
  entries.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(en=>{
    const m=parseNo(en.no);
    if(m){
      if(seenNo[en.no]){
        maxNo[m.p]=(maxNo[m.p]||0)+1;
        en.no=m.p+'-'+maxNo[m.p];seenNo[en.no]=1;
        enqueue({action:'save',entry:en,cols:colsOf(en)},true);

async function flush(){

  while(outbox.length){

function oLabel(f){return OTHER_LABEL[f.k]||String(f.label||f.k).replace(/[(（].*$/,'').trim()}
function colsOf(e){
  const fs=catFields(e.cat),d=e.data;
  const c={tab:catName(e.cat),date:iso6(d.date||''),kind:'',partner:'',content:'',note:'',amount:'',done:'',doneDate:'',bill:'',payDate:'',other:''};
  const others=[];
  const oneline=v=>String(v).replace(/\s*\n+\s*/g,' / ');
  fs.forEach(f=>{
    const v=d[f.k];
    switch(f.type){
      case 'person':
        if(f.k==='partner'){c.partner=v||''}
        else if(v){others.push(oLabel(f)+': '+v)}
        break;
      case 'ankenlink':
        if(v)others.push('案件: '+v);
        break;
      case 'bukkenlink':
        if(v)others.push('物件: '+v);
        break;
      case 'personlist':
        if(v&&v.length)others.push(oLabel(f)+': '+v.join('、'));
        break;
      case 'select':
        if(f.k==='kind'||f.k==='io'){c.kind=(v&&v!=='未設定')?v:''}
        else if(f.k==='status'){c.done=v||''}
        else if(v){others.push(oLabel(f)+': '+v)}
        break;
      case 'flags':
        if(Array.isArray(v)&&v.length)others.push((f.k==='bizs'?'業務':'区分')+': '+v.join('・'));
        break;
      case 'statline':
        if(f.k==='done'){c.done=d[f.sk]||'';c.doneDate=iso6(d[f.dk]||'')}
        else if(f.k==='bill'){c.bill=d[f.sk]||'';if(f.dk&&d[f.dk])others.push('請求日: '+iso6(d[f.dk]));if(f.ak&&d[f.ak]!==''&&d[f.ak]!==undefined)others.push((f.alabel||'請求金額')+': '+d[f.ak])}
        else if(f.k==='pay'){others.push('入金: '+(d[f.sk]||f.options[0]));c.payDate=iso6(d[f.dk]||'');if(f.ak&&d[f.ak]!==''&&d[f.ak]!==undefined)others.push((f.alabel||'入金金額')+': '+d[f.ak])}
        break;
      case 'amount':
        if(f.k==='amount')c.amount=(v!==''&&v!==undefined)?v:'';
        else if(v!==''&&v!==undefined&&v!==null)others.push(oLabel(f)+': ¥'+Number(v).toLocaleString('ja-JP'));
        break;
      case 'minutes':
        if(v)others.push('所要時間: '+fmtMin(v));
        break;
      case 'seconds':
        if(v)others.push('秒数: '+v+'秒');
        break;
      case 'date6o':
        if(valid6(v||''))others.push(oLabel(f)+': '+iso6(v));
        break;
      case 'time4':
        if(valid4(v||''))others.push(oLabel(f)+': '+fmt4(v));
        break;
      case 'md4':
        if(valid_md4(v||''))others.push(oLabel(f)+': '+v.slice(0,2)+'/'+v.slice(2,4));
        break;
      case 'ymd8':
        if(valid_ymd8(v||''))others.push(oLabel(f)+': '+v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8));
        break;
      case 'unitnum':
        if(v!==''&&v!==undefined&&v!==null)others.push(oLabel(f)+': '+v+(f.unit||''));
        break;
      case 'deadlist':
        if(Array.isArray(v)&&v.length)others.push('手動期限: '+v.map(x=>x.n+'('+(iso6(x.d)||x.d)+(x.r?'・毎年':'')+')').join('、'));
        break;
      case 'photos':
        if(Array.isArray(v)&&v.length)others.push('写真: '+v.length+'枚');
        break;
      case 'text': case 'textarea': case 'bigtext':
        if(f.main){c.content=oneline(v||'')}
        else if(f.k==='note'){c.note=oneline(v||'')}
        else if(v){others.push(oLabel(f)+': '+oneline(v))}
        break;
    }
  });
  if(d.doneAt)others.push('完了時刻: '+String(d.doneAt).slice(11,16));
  if(d.manualDone)others.push('手動完了日: '+d.manualDone);
  if(d.durMin)others.push('所要: '+d.durMin+'分');
  if(e.arch)others.push('アーカイブ済み');
  if(e.cat==='pf'&&d.money){
    if(d.money==='レシピ'){if(!c.kind)c.kind='レシピ'}
    else{c.bill=d.money;if(c.amount==='')c.amount=pfMoneyAmt(d)||''}
  }
  if(e.no)others.unshift('No: '+e.no);
  c.other=others.join(' / ');
  return c;
}

let fetchRetry=0,fetchTimer=null,lastFetchOk=0;
async function fetchAll(){
  if(!apiKey)return;
  updStat('読込中…');
  try{
    const res=await fetch(GAS_URL+'?key='+encodeURIComponent(apiKey));
    const j=await res.json();
    if(j&&j.error==='unauthorized'){apiKey='';lsSet(LS_KEY,'');showKeyScreen('合言葉が違います。もう一度入力してください');updStat('未接続');return}
    if(!j||!j.ok)throw 0;
    let sv=j.entries||[];
    const localPrev=entries.slice();
    let resend=false;
    /* 空サーバ保護: シート作り直し直後は手元の記録を正として自動復元する */
    if(sv.length===0&&localPrev.length>0){sv=localPrev.slice();resend=true}
    outbox.filter(o=>o.action==='save').forEach(o=>{
      const i=sv.findIndex(x=>String(x.id)===String(o.entry.id));
      if(i>=0)sv[i]=o.entry;else sv.push(o.entry);
    });
    outbox.filter(o=>o.action==='delete').forEach(o=>{sv=sv.filter(x=>String(x.id)!==String(o.id))});
    sv.sort((a,b)=>(b.ts||0)-(a.ts||0));
    entries=sv;
    if(j.config){
      /* v62: cats32(タブ定義の保存値)は読まない。定義は常にコード側の最新を使う */
      if(Array.isArray(j.config.groups)&&j.config.groups.length)groups=j.config.groups;
      if(Array.isArray(j.config.recent))recentPeople=j.config.recent;
    }
    migrate();
    /* 新しい列形式への一斉再送(初回のみ。schemaマーカーで判定) */
    if(resend||!j.config||j.config.schema!==4){
      entries.forEach(en=>enqueue({action:'save',entry:en,cols:colsOf(en)},true));
      enqueue({action:'config',name:'schema',value:4},true);
    }
    if(!cats.find(c=>c.id===activeCat))activeCat=cats[0].id;
    if(!groups.find(g=>g.id===activeGroup))activeGroup=groups[0].id;
    saveLocal();
    renderTabs();
    if(!formBusy())renderFields();
    renderTimeline();
    fetchRetry=0;lastFetchOk=Date.now();
    updStat();flush();
  }catch(e){
    updStat('オフライン(前回データを表示中)');
    /* 自動リトライ: 3秒→8秒→20秒→45秒の4回まで粘る */
    if(fetchRetry<4){
      fetchRetry++;
      clearTimeout(fetchTimer);
      fetchTimer=setTimeout(fetchAll,[3000,8000,20000,45000][fetchRetry-1]);
    }
  }
}

/* ---- 自作ダイアログ(prompt/confirmの代わり。全環境で動く) ---- */
let askCb=null;
function askText(title,initial,cb){
  askCb=cb;
  document.getElementById('askTitle').textContent=title;
  const inp=document.getElementById('askInput');
  inp.value=initial||'';
  document.getElementById('askOverlay').classList.add('open');
  setTimeout(()=>{inp.focus();inp.select()},50);
}
function askOk(){
  const v=document.getElementById('askInput').value.trim();
  document.getElementById('askOverlay').classList.remove('open');
  const cb=askCb;askCb=null;
  if(v&&cb)cb(v);
}
function askCancel(){
  document.getElementById('askOverlay').classList.remove('open');askCb=null;
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('askOverlay').classList.contains('open')){
    if(e.key==='Enter')askOk();
    if(e.key==='Escape')askCancel();
  }
});
let confCb=null;
function askConfirm(title,okLabel,cb){
  confCb=cb;
  document.getElementById('confTitle').textContent=title;
  document.getElementById('confOkBtn').textContent=okLabel||'実行する';
  document.getElementById('confOverlay').classList.add('open');
}
function confOk(){
  document.getElementById('confOverlay').classList.remove('open');
  const cb=confCb;confCb=null;
  if(cb)cb();
}
function confCancel(){
  document.getElementById('confOverlay').classList.remove('open');confCb=null;
}

/* ---- 日付ユーティリティ(6桁 YYMMDD) ---- */
function nowStamp(){
  const t=new Date();
  const p=n=>String(n).padStart(2,'0');
  return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes());
}
function applyDoneMeta(d,prevData){
  if(d.doneStat==='完了'){
    d.doneAt=(prevData&&prevData.doneAt)?prevData.doneAt:nowStamp();
    const da=String(d.doneAt).slice(0,10);
    const dd=valid6(d.doneDate||'')?iso6(d.doneDate):'';
    if(dd&&dd!==da)d.manualDone=dd;
  }
  return d;
}
function today6(){
  const d=new Date();
  return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
}
function valid6(s){
  if(!/^\d{6}$/.test(s))return false;
  const m=+s.slice(2,4),dd=+s.slice(4,6);
  return m>=1&&m<=12&&dd>=1&&dd<=31;
}
function valid4(s){
  if(!/^\d{4}$/.test(s))return false;
  return +s.slice(0,2)<=23&&+s.slice(2,4)<=59;
}
function fmt4(s){return valid4(s)? s.slice(0,2)+':'+s.slice(2,4) : (s||'')}
function fmt6(s){return valid6(s)? s.slice(0,2)+'/'+s.slice(2,4)+'/'+s.slice(4,6) : (s||'')}
function iso6(s){return valid6(s)? '20'+s.slice(0,2)+'-'+s.slice(2,4)+'-'+s.slice(4,6) : (s||'')}

/* ============== タブ(全面カラー) ============== */
function catOf(id){return cats.find(c=>c.id===id)}
function renderTabs(){
  const el=document.getElementById('tabs'); el.innerHTML='';
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='tab'+(c.id===activeCat?' active':'');
    b.style.background=c.color;
    b.style.color=c.text||'#fff';
    b.textContent=c.name;
    b.onclick=()=>{
      if(c.id===activeCat)return;
      guardLeave(()=>{activeCat=c.id;editingId=null;listLimit=20;renderTabs();renderFields();renderTimeline();});
    };
    el.appendChild(b);
  });
  const cc=catOf(activeCat);
  const sb=document.getElementById('saveBtn');
  sb.style.background=cc.color;sb.style.color=cc.text||'#fff';
  document.getElementById('entrycard').style.borderTopColor=cc.color;
}
function formDirty(){
  try{
    if(editingId)return true;
    const c=catOf(activeCat);
    const d=readFields();
    if(hasBodyOf(c,d))return true;
    const fl=c.fields.find(f=>f.type==='flags');
    if(fl&&(selState[fl.k]||[]).filter(v=>!(fl.alwaysOn||[]).includes(v)).length)return true;
  }catch(e){return true} /* 判定できない時は安全側=入力中とみなす */
  return false;
}
let lastTouch=0;
function formBusy(){
  if(Date.now()-lastTouch<10000)return true; /* 直近10秒以内に触れていたら絶対に触らない */
  try{
    const ec=document.getElementById('entrycard');
    const ae=document.activeElement;
    if(ec&&ae&&ec.contains(ae))return true; /* カーソルがフォーム内にある間も禁止 */
  }catch(e){return true}
  return formDirty();
}
function needGuard(){
  try{
    const c=catOf(activeCat);
    const reqFlag=c.fields.find(f=>f.type==='flags'&&f.required);
    if(reqFlag&&(selState[reqFlag.k]||[]).length===0){
      const d=readFields();
      return hasBodyOf(c,d);
    }
  }catch(e){}
  return false;
}
function guardLeave(cb){
  const go=()=>{clearDraft();cb()}; /* 破棄を選んだら下書きも消す */
  if(needGuard()){
    askConfirm('区分を選んでいません。保存されていませんが、次の画面に行っていいですか?','移動する',go);
    return;
  }
  if(formDirty()){
    askConfirm('編集内容は破棄されますが、よろしいですか?','破棄して移動',go);
    return;
  }
  cb();
}

/* ---- 入力途中の自動下書き(スマホの強制再読み込みで入力が消える対策) ---- */
const LS_DRAFT='ql_draft_v1';
let draftTimer=null;
function saveDraft(){
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{
    try{
      const c=catOf(activeCat);if(!c)return;
      const d=readFields();
      if(editingId||hasBodyOf(c,d)){
        if(durState)d.durMin=durState;
        lsSet(LS_DRAFT,JSON.stringify({cat:activeCat,editingId:editingId,data:d,ts:Date.now()}));
      }else{
        lsSet(LS_DRAFT,'');
      }
    }catch(e){}
  },400);
}
function clearDraft(){clearTimeout(draftTimer);draftTimer=null;lsSet(LS_DRAFT,'')}
function restoreDraft(){
  try{
    const dr=JSON.parse(lsGet(LS_DRAFT)||'null');
    if(!dr||!dr.data)return false;
    if(Date.now()-(dr.ts||0)>86400000){lsSet(LS_DRAFT,'');return false} /* 1日経った下書きは捨てる */
    const c=cats.find(x=>x.id===dr.cat);if(!c)return false;
    if(dr.editingId&&!entries.some(x=>String(x.id)===String(dr.editingId)))dr.editingId=null;
    if(!dr.editingId&&!hasBodyOf(c,dr.data))return false;
    activeCat=dr.cat;
    editingId=dr.editingId||null;
    renderTabs();
    renderFields(dr.data);
    setTimeout(()=>toast('入力途中だった内容を復元しました'),500);
    return true;
  }catch(e){return false}
}

let selState={};
function renderFields(vals={}){
  const c=catOf(activeCat);
  const f=document.getElementById('fields');
  document.getElementById('editingNote').style.display=editingId?'block':'none';
  selState={};plState={};phState=[];
  c.fields.filter(x=>x.type==='personlist').forEach(x=>{
    plState[x.k]=Array.isArray(vals[x.k])?vals[x.k].slice():[];
  });
  c.fields.filter(x=>x.type==='photos').forEach(x=>{
    phState=Array.isArray(vals[x.k])?vals[x.k].slice():[];
  });
  let html='',i=0;const fsArr=c.fields;
  while(i<fsArr.length){
    const f0=fsArr[i];
    if(f0.row){
      const grp=[f0];let j=i+1;
      while(j<fsArr.length&&fsArr[j].row===f0.row){grp.push(fsArr[j]);j++}
      html+='<div class="row2'+(f0.row==='h1'?' tight':'')+'">'+grp.map(g=>fieldHTML(g,vals)).join('')+'</div>';
      i=j;
    }else{html+=fieldHTML(f0,vals);i++}
  }
  f.innerHTML=html;
  c.fields.filter(x=>x.type==='select').forEach(x=>{
    selState[x.k]=(x.k in vals)?(vals[x.k]??''):(x.optional?'':(x.def||x.options[0]));
    paintSelect(x);
  });
  c.fields.filter(x=>x.type==='flags').forEach(x=>{
    let fv=vals[x.k];
    if(typeof fv==='string')fv=({'A群':['緊急','重要'],'B群':['緊急'],'C群':['重要'],'D群':[]})[fv]||[];
    selState[x.k]=Array.isArray(fv)?sortFlags(fv.slice()):[];
    (x.alwaysOn||[]).forEach(v=>{if(!selState[x.k].includes(v))selState[x.k].push(v)});
    selState[x.k]=sortFlags(selState[x.k]);
    paintFlags(x);
  });
  c.fields.filter(x=>x.type==='date6').forEach(x=>bindDate6('f_'+x.k,false));
  c.fields.filter(x=>x.type==='date6o').forEach(x=>bindD6o('f_'+x.k));
  c.fields.filter(x=>x.type==='time4').forEach(x=>bindT4('f_'+x.k));
  c.fields.filter(x=>x.type==='md4').forEach(x=>bindMd4('f_'+x.k));
  c.fields.filter(x=>x.type==='ymd8').forEach(x=>bindYmd8('f_'+x.k));
  dlState={};
  c.fields.filter(x=>x.type==='deadlist').forEach(x=>{
    dlState[x.k]=Array.isArray(vals[x.k])?vals[x.k].map(o=>({n:o.n||'',d:o.d||'',r:!!o.r})):[];
    renderDL(x.k);
  });
  c.fields.filter(x=>x.type==='statline').forEach(x=>{
    bindDate6('f_'+x.k+'_d',true);
    paintStat(x.k);
  });
  durState=+(vals.durMin)||0;
  paintDur();
  c.fields.filter(x=>x.type==='personlist').forEach(x=>renderPL(x.k));
  if(c.fields.some(x=>x.type==='photos'))renderPhotos();
  applyShowIf();applyBigIf();
  const main=c.fields.find(x=>x.main);
  if(main&&!editingId){const e=document.getElementById('f_'+main.k);if(e&&e.focus)setTimeout(()=>{try{e.focus({preventScroll:true})}catch(_){ }window.scrollTo({top:0})},50)}
}
function selButtonsHTML(fd){
  let h=fd.options.map(o=>`<button data-v="${escAttr(o)}" onclick="setSel('${fd.k}','${escAttr(o)}')">${esc((fd.labels&&fd.labels[o])||o)}</button>`).join('');
  return h;
}
function fieldHTML(fd,vals){
  const v=vals[fd.k];
  const wrap=(inner)=>`<div class="field" id="w_${fd.k}"><label>${fd.label}${fd.hint?` <span style="letter-spacing:0;color:#A9AFB9">— ${fd.hint}</span>`:''}</label>${inner}</div>`;
  switch(fd.type){
    case 'date6':{
      const val=v||today6();
      return wrap(`<input type="text" class="date6 num" id="f_${fd.k}" inputmode="numeric" maxlength="6" value="${escAttr(val)}">`);
    }
    case 'person':return wrap(`<button class="personbtn ${v?'':'empty'}" id="f_${fd.k}" onclick="openPicker('f_${fd.k}','${fd.label}')">${esc(v||'')}</button>`);
    case 'ankenlink':return wrap(`<button class="personbtn ${v?'':'empty'}" id="f_${fd.k}" onclick="openAnkenPicker('${fd.k}')">${esc(v||'')}</button>`);
    case 'bukkenlink':return wrap(`<button class="personbtn ${v?'':'empty'}" id="f_${fd.k}" onclick="openBukkenPicker('${fd.k}')">${esc(v||'')}</button>`);
    case 'date6o':return wrap(`<input type="text" class="date6 num" id="f_${fd.k}" inputmode="numeric" maxlength="6" placeholder="未入力" value="${escAttr(v||'')}">`);
    case 'time4':return wrap(`<input type="text" class="date6 num" id="f_${fd.k}" inputmode="numeric" maxlength="4" placeholder="例:1400" value="${escAttr(v||'')}">`);
    case 'md4':return wrap(`<input type="text" class="date6 num" id="f_${fd.k}" inputmode="numeric" maxlength="4" placeholder="例:0331" value="${escAttr(v||'')}">`);
    case 'ymd8':return wrap(`<input type="text" class="date6 num" id="f_${fd.k}" inputmode="numeric" maxlength="8" placeholder="例:19850506" value="${escAttr(v||'')}" style="width:140px !important">`);
    case 'unitnum':return wrap(`<span style="display:flex;align-items:center;gap:6px"><input type="text" class="date6 num" id="f_${fd.k}" inputmode="numeric" maxlength="5" value="${escAttr(v||'')}"><span style="font-size:.85rem;color:var(--sub)">${esc(fd.unit||'')}</span></span>`);
    case 'deadlist':return wrap(`<div id="f_${fd.k}"></div><button type="button" class="dladd" onclick="dlAdd('${fd.k}')">＋ 期限を追加</button>`);
    case 'personlist':return wrap(`<div class="plchips" id="f_${fd.k}"></div>`);
    case 'photos':return wrap(`<div class="phrow" id="f_${fd.k}"></div>`);
    case 'text':return wrap(`<input type="text" id="f_${fd.k}" placeholder="${escAttr(fd.ph||'')}" value="${escAttr(v||'')}">`);
    case 'textarea':return wrap(`<textarea id="f_${fd.k}" placeholder="${escAttr(fd.ph||'')}">${esc(v||'')}</textarea>`);
    case 'bigtext':return wrap(`<textarea class="big${fd.compact?' oneline':''}" id="f_${fd.k}" placeholder="${escAttr(fd.ph||'')}">${esc(v||'')}</textarea>`);
    case 'amount':return wrap(`<input type="number" id="f_${fd.k}" inputmode="numeric" placeholder="0" value="${v??''}">`);
    case 'minutes':return wrap(
      `<div class="minrow"><input type="number" id="f_${fd.k}" inputmode="numeric" placeholder="0" value="${v??''}"><span class="unit">分</span>`+
      [15,30,60,120].map(m=>`<button onclick="setMin('${fd.k}',${m})">${m<60?m+'分':(m/60)+'時間'}</button>`).join('')+`</div>`);
    case 'seconds':return wrap(
      `<div class="minrow"><input type="number" id="f_${fd.k}" inputmode="numeric" placeholder="0" value="${v??''}"><span class="unit">秒</span></div>`);
    case 'select':{
      if(fd.dd){
        const cur=(fd.k in vals)?(vals[fd.k]??''):(fd.optional?'':(fd.def||fd.options[0]));
        return wrap(`<select class="ddsel" id="f_${fd.k}" onchange="ddChange('${fd.k}')">${fd.options.map(o=>`<option value="${escAttr(o)}"${cur===o?' selected':''}>${esc((fd.labels&&fd.labels[o])||o)}</option>`).join('')}</select>`);
      }
      return wrap(`<div class="selrow" id="f_${fd.k}">${selButtonsHTML(fd)}</div>`);
    }
    case 'flags':return wrap(`<div class="selrow" id="f_${fd.k}">${fd.options.map(o=>`<button data-v="${escAttr(o)}" onclick="setFlag('${fd.k}','${escAttr(o)}')">${esc((fd.labels&&fd.labels[o])||o)}</button>`).join('')}</div>`);
    case 'statline':{
      const sv=vals[fd.sk]||fd.options[0];
      const apart=fd.ak?`
        <div class="sl"><label>${fd.alabel||'金額'}</label>
          <input type="number" id="f_${fd.k}_a" inputmode="numeric" placeholder="0" value="${escAttr(vals[fd.ak]??'')}" style="width:110px"></div>`:'';
      const dpart=fd.dk?`
        <div class="sl"><label>${fd.dlabel}</label>
          <input type="text" class="date6 num" id="f_${fd.k}_d" inputmode="numeric" maxlength="6" placeholder="未入力" value="${escAttr(vals[fd.dk]||'')}"></div>`:'';
      const durpart=(fd.sk==='doneStat')?`<div class="durrow" id="dur_${fd.k}" style="display:${sv===(fd.okv||fd.options[1])?'flex':'none'}"><span class="durlbl">所要(任意):</span>${[[15,'15分'],[30,'30分'],[60,'1時間'],[120,'2時間'],[240,'半日'],[480,'1日']].map(x=>`<button type="button" data-m="${x[0]}" onclick="setDur(${x[0]})">${x[1]}</button>`).join('')}</div>`:'';
      return `<div class="field" id="w_${fd.k}"><div class="statline">
        <div class="sl"><label>${fd.label}</label>
          <select id="f_${fd.k}_s" onchange="statChange('${fd.k}')">
            ${fd.options.map(o=>`<option${sv===o?' selected':''}>${esc(o)}</option>`).join('')}
          </select></div>${apart}${dpart}
      </div>${durpart}</div>`;
    }
  }
  return '';
}

/* ---- 写真の選択・縮小・プレビュー(v65) ---- */
function pickPhoto(){const e=document.getElementById('photoFile');if(e)e.click()}
function photoPicked(inp){
  const files=Array.from(inp.files||[]);
  inp.value='';
  if(!files.length)return;
  files.slice(0,10).forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const MAX=1280;
          let w=img.width,h=img.height;
          if(Math.max(w,h)>MAX){const k=MAX/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
          const cv=document.createElement('canvas');cv.width=w;cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          const dataURL=cv.toDataURL('image/jpeg',0.72);
          const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
          photoData[id]=dataURL;
          phState.push(id);
          imgEnqueue(id,dataURL); /* 選んだ瞬間に送信待ちへ(下書き復元でも写真が残るように) */
          renderPhotos();
          saveDraft();
        }catch(e){toastErr('画像を取り込めませんでした')}
      };
      img.onerror=()=>toastErr('この画像形式は読み込めませんでした');
      img.src=r.result;
    };
    r.readAsDataURL(f);
  });
}
function renderPhotos(){
  const el=document.getElementById('f_photos');if(!el)return;
  el.innerHTML='';
  phState.forEach(pid=>{
    const box=document.createElement('span');box.className='phbox';
    const im=document.createElement('img');im.className='phthumb';im.alt='';
    loadPhoto(pid).then(d=>{if(d)im.src=d});

    x.onclick=()=>{phState=phState.filter(p=>p!==pid);renderPhotos();saveDraft()};
    box.appendChild(im);box.appendChild(x);
    el.appendChild(box);
  });
  const add=document.createElement('button');add.className='phadd';add.type='button';
  add.textContent='📷 写真を追加';
  add.onclick=pickPhoto;
  el.appendChild(add);
}

    e.classList.toggle('bad',e.value.length===4&&!valid4(e.value));

function calcDuration(){
  const st=document.getElementById('f_start'),en=document.getElementById('f_end'),mi=document.getElementById('f_minutes');
  if(!st||!en||!mi)return;
  if(valid4(st.value)&&valid4(en.value)){
    let diff=(+en.value.slice(0,2)*60+ +en.value.slice(2,4))-(+st.value.slice(0,2)*60+ +st.value.slice(2,4));
    if(diff<0)diff+=1440; /* 日またぎ */
    mi.value=diff;
  }
}
function valid_ymd8(x){
  if(!/^\d{8}$/.test(x))return false;
  const y=+x.slice(0,4),m=+x.slice(4,6),d=+x.slice(6,8);
  return y>=1900&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31;
}
function bindYmd8(id){
  const e=document.getElementById(id);if(!e)return;
  const u=()=>{
    e.value=e.value.replace(/[^\d]/g,'').slice(0,8);
    e.classList.toggle('bad',e.value.length===8&&!valid_ymd8(e.value));
  };
  e.oninput=u;u();
}
function valid_md4(x){
  if(!/^\d{4}$/.test(x))return false;
  const m=+x.slice(0,2),d=+x.slice(2,4);
  return m>=1&&m<=12&&d>=1&&d<=31;
}
function bindMd4(id){

}

const FLAG_ORDER={'緊急':1,'不急':2,'重要':3,'なし':4,'基本':10,'会計':11,'建設':12,'産廃':13,'宅建':14,'ビザ':15,'後見':16};
function sortFlags(arr){return arr.sort((a,b)=>(FLAG_ORDER[a]||9)-(FLAG_ORDER[b]||9))}
function setFlag(k,v){
  const fd=catOf(activeCat).fields.find(x=>x.k===k);if(!fd)return;
  if((fd.alwaysOn||[]).includes(v))return; /* 常時オンのボタンはオフにできない */
  let arr=(selState[k]||[]).slice();
  if(fd.single){
    arr=arr.includes(v)?[]:[v]; /* 二者択一(緊急/不急など) */
  }else if(v==='なし'){
    arr=arr.includes('なし')?[]:['なし'];
  }else{
    arr=arr.filter(x=>x!=='なし');
    const i=arr.indexOf(v);
    if(i>=0)arr.splice(i,1);else arr.push(v);
  }
  selState[k]=sortFlags(arr);
  paintFlags(fd);
  applyShowIf();
}
function paintFlags(fd){
  const el=document.getElementById('f_'+fd.k);if(!el)return;
  el.querySelectorAll('button').forEach(b=>{
    const on=(selState[fd.k]||[]).includes(b.dataset.v);
    b.className=on?('on '+((fd.cls&&fd.cls[b.dataset.v])||'')):'';

}

function paintSelect(fd){

}
function showIfOk(fd){
  const one=c=>{const v=selState[c.k];
    if(Array.isArray(v))return c.vs?c.vs.some(x=>v.includes(x)):v.includes(c.v);
    return c.vs?c.vs.includes(v):v===c.v};
  if(Array.isArray(fd.showIfAll))return fd.showIfAll.every(one);
  if(!fd.showIf)return true;
  return one(fd.showIf);
}
function hasShowIf(fd){return !!(fd.showIf||fd.showIfAll)}
function applyShowIf(){
  catOf(activeCat).fields.filter(hasShowIf).forEach(x=>{
    const w=document.getElementById('w_'+x.k);if(!w)return;
    w.style.display=showIfOk(x)?'block':'none';
  });
  /* 行(row2)の全項目が非表示なら行ごと畳む */
  document.querySelectorAll('#fields .row2').forEach(r=>{
    const kids=Array.from(r.children).filter(x=>x.classList&&x.classList.contains('field'));
    if(!kids.length)return;
    r.style.display=kids.some(x=>x.style.display!=='none')?'flex':'none';
  });
}
function applyBigIf(){
  catOf(activeCat).fields.filter(x=>x.bigIf).forEach(x=>{
    const e=document.getElementById('f_'+x.k);if(!e)return;
    e.classList.toggle('big',selState[x.bigIf.k]===x.bigIf.v);
  });
}
function hasBodyOf(c,d){
  return c.fields.some(fd=>{
    if(fd.type==='statline')return !!(fd.ak&&d[fd.ak]!==''&&d[fd.ak]!==undefined&&d[fd.ak]!==null);
    if(['date6','select','flags'].includes(fd.type))return false;
    const v=d[fd.k];
    if(Array.isArray(v))return v.length>0;
    return v!==''&&v!==undefined&&v!==null;
  });
}
function readFields(){
  const c=catOf(activeCat);const d={};
  c.fields.forEach(fd=>{
    if(hasShowIf(fd)&&!showIfOk(fd))return;
    if(fd.type==='statline'){
      d[fd.sk]=document.getElementById('f_'+fd.k+'_s').value;
      if(fd.ak){const ae=document.getElementById('f_'+fd.k+'_a');d[fd.ak]=(ae&&ae.value!=='')?Number(ae.value):''}
      if(fd.dk){const de=document.getElementById('f_'+fd.k+'_d');d[fd.dk]=de?de.value.trim():''}
      return;
    }
    if(fd.type==='personlist'){
      d[fd.k]=(plState[fd.k]||[]).slice();
      return;
    }
    if(fd.type==='photos'){
      d[fd.k]=phState.slice();
      return;
    }
    if(fd.type==='flags'){
      d[fd.k]=sortFlags((selState[fd.k]||[]).slice());
      return;
    }
    if(fd.type==='deadlist'){
      d[fd.k]=(dlState[fd.k]||[]).filter(x=>x.n||x.d).map(o=>({n:o.n,d:o.d,r:!!o.r}));
      return;
    }
    const e=document.getElementById('f_'+fd.k);if(!e)return;
    if(fd.type==='person'||fd.type==='ankenlink'||fd.type==='bukkenlink'){d[fd.k]=e.classList.contains('empty')?'':e.textContent}
    else if(fd.type==='select'){d[fd.k]=selState[fd.k]}
    else if(fd.type==='amount'||fd.type==='minutes'||fd.type==='seconds'){d[fd.k]=e.value===''?'':Number(e.value)}
    else{d[fd.k]=e.value.trim()}
  });
  if(c.fields.some(f=>f.type==='statline'&&f.sk==='doneStat')&&d.doneStat==='完了'&&durState)d.durMin=durState;
  return d;
}
function saveEntry(){
  const c=catOf(activeCat);const d=readFields();
  if(editingId){
    const prev=entries.find(x=>String(x.id)===String(editingId));
    if(prev&&Array.isArray(prev.data.doneKeys))d.doneKeys=prev.data.doneKeys;
    /* カルテは非表示中の欄の値を消さずに引き継ぐ(区分切替やレイアウト変更でデータが飛ばないように) */
    if(activeCat==='kanri'&&prev&&prev.data)Object.keys(prev.data).forEach(k=>{if(!(k in d))d[k]=prev.data[k]});
  }
  if(c.fields.some(f=>f.type==='statline'&&f.sk==='doneStat')){
    const prevE=editingId?entries.find(x=>String(x.id)===String(editingId)):null;
    applyDoneMeta(d,prevE?prevE.data:null);
  }
  if(activeCat==='seikyu'&&!d.date)d.date=today6();
  if(activeCat==='pf'&&(d.money==='請求済み'||d.money==='入金済み')&&!pfMoneyAmt(d)){toastErr('金額が読み取れません。内容に「55,000円」「5万5000円」のように円まで書いてください');return}
  const dateF=c.fields.find(f=>f.type==='date6');
  if(dateF&&d[dateF.k]&&!valid6(d[dateF.k])){toastErr('日付は6桁で入力してください(例:'+today6()+')');return}
  for(const fd of c.fields.filter(f=>f.type==='statline'&&f.dk)){
    if(d[fd.dk]&&!valid6(d[fd.dk])){toastErr(fd.dlabel.replace('(6桁)','')+'は6桁で入力してください');return}
  }
  for(const fd of c.fields.filter(f=>f.type==='date6o')){
    if(d[fd.k]&&!valid6(d[fd.k])){toastErr('日付は6桁で入力してください(例:'+today6()+')');return}
  }
  for(const fd of c.fields.filter(f=>f.type==='time4')){
    if(d[fd.k]&&!valid4(d[fd.k])){toastErr('時刻は4桁で入力してください(例:1400)');return}
  }
  for(const fd of c.fields.filter(f=>f.type==='md4')){
    if(hasShowIf(fd)&&!showIfOk(fd))continue;
    if(d[fd.k]&&!valid_md4(d[fd.k])){toastErr('月日は4桁で入力してください(例:0331)');return}
  }
  for(const fd of c.fields.filter(f=>f.type==='ymd8')){
    if(hasShowIf(fd)&&!showIfOk(fd))continue;
    if(d[fd.k]&&!valid_ymd8(d[fd.k])){toastErr('誕生日の場合は、年月日は8桁で入力してください(例:19850506)');return}
  }
  for(const fd of c.fields.filter(f=>f.type==='deadlist')){
    for(const x of (d[fd.k]||[])){
      if(!valid6(x.d)){toastErr('手動期限「'+(x.n||'(名称なし)')+'」の日付を6桁で入力してください');return}
    }
  }
  for(const fd of c.fields.filter(f=>f.type==='flags'&&f.required)){
    if(!((d[fd.k]||[]).length)){toastErr('区分を選んでください(緊急・不急)');return}
  }
  if(!hasBodyOf(c,d)){toastErr('内容を入れてください');return}
  Object.keys(d).forEach(k=>{
    const fd=c.fields.find(x=>x.k===k);
    if(!fd)return;
    if(fd.type==='person'&&d[k])pushRecent(d[k]);
    if(fd.type==='personlist')(d[k]||[]).forEach(pushRecent);
  });
  let rec;
  if(editingId){
    const idx=entries.findIndex(x=>String(x.id)===String(editingId));
    rec={id:editingId,cat:activeCat,ts:(idx>=0?entries[idx].ts:Date.now()),data:d};
    if(idx>=0)entries[idx]=rec;else entries.unshift(rec);
    editingId=null;toast('上書き保存しました');
  }else{
    rec={id:uid(),cat:activeCat,ts:Date.now(),data:d};
    const no=issueNo(activeCat);if(no)rec.no=no;
    entries.unshift(rec);
    toast(no?('保存しました('+no+')'):'保存しました');
  }
  saveLocal();
  pushEntryOp(rec);
  clearDraft();
  renderFields();renderTimeline();
}

/* ============== 案件ピッカー(紐づけ用) ============== */
let ankenTarget=null;
function ankenLabel(en){
  const d=en.data||{};
  const head=String(d.content||'').split('\n')[0];
  return ((d.partner?d.partner+'｜':'')+head).slice(0,40)||'(内容なし)';
}
/* 案件の紐づけ状況(件数と最終更新)。まとめ先の判断材料に使う */
function ankenLinkInfo(label){
  let n=0,last=0;
  entries.forEach(e=>{
    if(e.arch)return;
    const d=e.data||{};
    if(typeof d.anken==='string'&&d.anken===label){n++;if((e.ts||0)>last)last=e.ts||0}
  });
  return {n:n,last:last};
}
function tsDate(ts){
  if(!ts)return'';
  const t=new Date(ts);if(isNaN(t))return'';
  return String(t.getFullYear()).slice(2)+'/'+pad2(t.getMonth()+1)+'/'+pad2(t.getDate());
}

function renderAnkenList(){

  const el=document.getElementById('ankenList');el.innerHTML='';
  const list=entries.filter(e=>e.cat==='anken'&&!e.arch)

    .filter(e=>ankenShowDone||(e.data||{}).doneStat!=='完了')
    .filter(e=>!q||ankenLabel(e).includes(q)||entryValues(e).join(' ').includes(q));
  if(!list.length){el.innerHTML='<div style="color:var(--sub);font-size:.85rem;padding:14px 4px">該当する案件がありません(完了済みは「完了した案件を含む」で表示されます)。</div>'}
  list.forEach(e=>{

    const info=ankenLinkInfo(lbl);
    const own=(e.data||{}).date;
    const meta=[e.no||'',own?'発生 '+fmt6(own):'','紐づけ'+info.n+'件',info.last?'最終 '+tsDate(info.last):''].filter(Boolean).join('・');
    b.innerHTML=esc(lbl)+'<br><span style="font-size:.74rem;color:var(--sub)">'+esc(meta)+'</span>';
    b.onclick=()=>pickAnken(lbl);
    el.appendChild(b);
  });

function pickAnken(label){
  if(ankenTarget==='__filter__'){
    ankenFilter=label||'';
    listLimit=20;
    paintFilters();renderTimeline();
    closeAnkenPicker();
    return;
  }
  if(ankenTarget==='__merge__'){
    closeAnkenPicker();
    if(!label)return;
    const srcId=mergeSrcId,srcLabel=mergeSrcLabel;
    const src=entries.find(x=>String(x.id)===String(srcId));
    const si=ankenLinkInfo(srcLabel),di=ankenLinkInfo(label);
    const sd=(src&&src.data&&src.data.date)?fmt6(src.data.date):'';
    const same=(srcLabel===label);
    const dest=entries.find(x=>x.cat==='anken'&&!x.arch&&String(x.id)!==String(srcId)&&ankenLabel(x)===label);
    const srcMeta=[(src&&src.no)||'',sd?'発生 '+sd:'','紐づけ'+si.n+'件'].filter(Boolean).join('・');
    const destMeta=[(dest&&dest.no)||'','紐づけ'+di.n+'件'].filter(Boolean).join('・');
    const after=same
      ?'まとめ後: 紐づけ'+si.n+'件のまま(同名のため共通)。一覧のダブりが消えます'
      :'まとめ後: 「'+label+'」に紐づけ'+(si.n+di.n)+'件が集まります';
    askConfirm('まとめ元: 「'+srcLabel+'」('+srcMeta+')\n　↓ 紐づけ・金額の記録がすべて移ります\nまとめ先: 「'+label+'」('+destMeta+')\n\n'+after+'。まとめ元の内容・備考はアーカイブで見られます(番号は変わりません)','まとめる',()=>doMergeAnken(srcId,label));
    return;
  }
  const e=document.getElementById('f_'+ankenTarget);
  if(e){

let mergeSrcId=null,mergeSrcLabel='';
function mergeAnkenStart(){
  const src=entries.find(x=>String(x.id)===String(detailId));
  if(!src||src.cat!=='anken')return;
  mergeSrcId=src.id;mergeSrcLabel=ankenLabel(src);
  closeDetail();

function doMergeAnken(srcId,destLabel){
  const src=entries.find(x=>String(x.id)===String(srcId));
  if(!src)return;
  const srcLabel=ankenLabel(src);
  let n=0;
  /* 同名の重複案件は紐づけがすでに共通なので、付け替えは名前が違う時だけ行う */
  if(srcLabel!==destLabel){
    entries.forEach(en=>{
      if(String(en.id)===String(srcId))return;
      const d=en.data;if(!d)return;
      if(typeof d.anken==='string'&&d.anken===srcLabel){
        d.anken=destLabel;n++;
        enqueue({action:'save',entry:en,cols:colsOf(en)},true);
      }
    });
  }
  const dest=entries.find(x=>x.cat==='anken'&&!x.arch&&String(x.id)!==String(srcId)&&ankenLabel(x)===destLabel);
  src.arch=1;
  src.data.mergedInto=destLabel;
  if(dest&&dest.no)src.data.mergedIntoNo=dest.no;
  enqueue({action:'save',entry:src,cols:colsOf(src)},true);
  if(ankenFilter===srcLabel){ankenFilter=destLabel;paintFilters()}
  saveLocal();flush();
  renderTimeline();
  const sN=src.no?src.no+' ':'',dN=(dest&&dest.no)?dest.no+' ':'';
  toast(srcLabel===destLabel
    ?'同名の重複案件をまとめました('+sN+'をアーカイブ、'+dN+'が残ります。紐づけは共通のためそのままです)'
    :sN+'「'+srcLabel+'」を'+dN+'「'+destLabel+'」にまとめました(紐づく記録'+n+'件を付け替え)');
}

/* ============== 期限管理(管理タブ)エンジン ============== */
function kToday(){const t=new Date();t.setHours(0,0,0,0);return t}
function pad2(n){return String(n).padStart(2,'0')}
function dstr(dt){return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate())}
function addMonthsClamp(y,m,d,add){
  /* m:1-12。元が月末なら結果も月末に合わせる(3/31+2ヶ月=5/31、12/31+2ヶ月=2/28等) */
  const lastSrc=new Date(y,m,0).getDate();
  const isEnd=(d>=lastSrc);
  let nm=m-1+add, ny=y+Math.floor(nm/12); nm=((nm%12)+12)%12;
  const lastDst=new Date(ny,nm+1,0).getDate();
  const nd=isEnd?lastDst:Math.min(d,lastDst);
  return new Date(ny,nm,nd);
}
let KD_WITHDONE=false;
function annualSeries(calcFn,today,done,kindKey,regTs){
  /* カルテ登録日の1年前(=1個前分)から次回分までの、未対応の全回を返す */
  const reg=regTs?new Date(regTs):today;
  const start=new Date(reg);start.setFullYear(start.getFullYear()-1);
  let y=today.getFullYear()+2;
  while(calcFn(y)>today)y--; /* y=直近過去分の年 */
  const out=[];
  for(let yy=y-6;yy<=y+1;yy++){
    const dt=calcFn(yy);
    if(dt<=today&&dt<start)continue; /* 窓より古い過去分は出さない */
    const key=kindKey+'@'+dstr(dt);
    if(done.includes(key)){if(KD_WITHDONE)out.push({date:dt,key,done:true});continue}
    out.push({date:dt,key});
  }
  return out.slice(-4); /* 念のため最大4件 */
}
function annualFrom(calcFn,today,done,kindKey){
  /* calcFn(y)=その年度分の対象日。直近過去分が未対応なら超過として返し、対応済みなら次回分を返す */
  let y=today.getFullYear()+1;
  while(calcFn(y)>today)y--;
  const past=calcFn(y);
  const pk=kindKey+'@'+dstr(past);
  if(!done.includes(pk))return{date:past,key:pk};
  const next=calcFn(y+1);
  return{date:next,key:kindKey+'@'+dstr(next)};
}
function fixedFrom(dt,done,kindKey){
  const key=kindKey+'@'+dstr(dt);
  if(done.includes(key))return KD_WITHDONE?{date:dt,key,done:true}:null;
  return{date:dt,key};
}
const KD_STD=[[30,'資料依頼'],[14,'作成着手'],[7,'最終確認']];
const KD_KOKEN=[[60,'資料収集'],[30,'報告書作成']];
function kanriDeadlines(en,today){
  const d=en.data||{},out=[],done=Array.isArray(d.doneKeys)?d.doneKeys:[];
  const cust=d.partner||'(顧客未設定)';
  const put=(kind,r,steps,low,main)=>{if(!r)return;(Array.isArray(r)?r:[r]).forEach(o=>{const mo=(typeof main==='function')?main(o.date):(main||null);out.push({id:en.id,cust,kind,date:o.date,key:o.key,over:o.date<today&&!o.done,steps:steps||null,low:!!low,main:mo,done:!!o.done})})};
  const BIZMAP={'会計':'会計','建設業許可':'建設','産廃業許可':'産廃','宅建業許可':'宅建','ビザ申請':'ビザ','法定後見':'後見','任意後見':'後見'};
  const bizs=Array.isArray(d.bizs)?d.bizs:(d.biz&&BIZMAP[d.biz]?[BIZMAP[d.biz]]:[]);
  const d6=x=>new Date(+('20'+x.slice(0,2)),+x.slice(2,4)-1,+x.slice(4,6));
  const minus=(dt,days)=>{const t=new Date(dt);t.setDate(t.getDate()-days);return t};
  const kmOf=(a)=>{const ht=a.htype||'法人';if(ht==='個人')return[12,31];if(valid_md4(a.kessan||''))return[+a.kessan.slice(0,2),+a.kessan.slice(2,4)];return[0,0]};
  if(bizs.includes('会計')){
    const ht=d.htype||'法人';
    const [km,kd_]=kmOf(d);
    if(km>0){
      if(ht==='個人'){
        put('確定申告期限',annualSeries(y=>new Date(y+1,2,15),today,done,'kakutei',en.ts),KD_STD);
        if(d.kazei!=='免税')put('消費税の申告期限',annualSeries(y=>new Date(y+1,2,31),today,done,'shohizei',en.ts),KD_STD);
      }else{
        put('法人税等の申告期限',annualSeries(y=>addMonthsClamp(y,km,kd_,2),today,done,'houjinzei',en.ts),KD_STD);
        if(d.kazei!=='免税')put('消費税の申告期限',annualSeries(y=>addMonthsClamp(y,km,kd_,2),today,done,'shohizei',en.ts),KD_STD);
      }
      const mainQ=o=>{let m=addMonthsClamp(o.getFullYear(),km,kd_,0);if(m<o)m=addMonthsClamp(o.getFullYear()+1,km,kd_,0);return m};
      put('四半期チェック①',annualSeries(y=>addMonthsClamp(y,km,kd_,-9),today,done,'q1check',en.ts),null,true,mainQ);
      put('四半期チェック②',annualSeries(y=>addMonthsClamp(y,km,kd_,-6),today,done,'q2check',en.ts),null,true,mainQ);
      put('四半期チェック③(来期の消費税方式を検討)',annualSeries(y=>addMonthsClamp(y,km,kd_,-3),today,done,'q3check',en.ts),null,true,mainQ);
      put('本決算',annualSeries(y=>addMonthsClamp(y,km,kd_,0),today,done,'honkessan',en.ts),null);
    }
  }
  if(bizs.includes('建設')){
    if(valid6(d.kyoka||'')){
      const man=d6(d.kyoka);
      put('建設業許可・更新準備開始',fixedFrom(minus(man,90),done,'kyoka_prep'),null,false,man);
      put('建設業許可・更新申請期限',fixedFrom(minus(man,30),done,'kyoka_limit'),null,false,man);
    }
    const [km,kd_]=kmOf(d);
    if(km>0)put('建設業・決算変更届',annualSeries(y=>addMonthsClamp(y,km,kd_,4),today,done,'kessanhenko',en.ts),KD_STD);
  }
  if(bizs.includes('産廃')&&valid6(d.sanpai||'')){
    const man=d6(d.sanpai);
    put('産廃業許可・更新準備と講習確認',fixedFrom(minus(man,180),done,'sanpai_prep'),null,false,man);
    put('産廃業許可・更新申請の目安',fixedFrom(minus(man,60),done,'sanpai_limit'),null,false,man);
  }
  if(bizs.includes('宅建')){
    if(valid6(d.takken||'')){
      const man=d6(d.takken);
      put('宅建業免許・更新受付開始',fixedFrom(minus(man,90),done,'takken_prep'),null,false,man);
      put('宅建業免許・更新申請期限',fixedFrom(minus(man,30),done,'takken_limit'),null,false,man);
    }
    if(valid6(d.takkenshi||'')){
      const man=d6(d.takkenshi);
      put('宅建士証・法定講習の予約',fixedFrom(minus(man,180),done,'tk_prep'),null,false,man);
      put('宅建士証・満了日',fixedFrom(man,done,'tk_exp'),null);
    }
  }
  if(bizs.includes('ビザ')){
    if(valid6(d.zexp||'')){
      const man=d6(d.zexp);
      put('在留期間更新・申請準備',fixedFrom(minus(man,90),done,'za_prep'),null,false,man);
      put('在留期限',fixedFrom(man,done,'za_exp'),null);
    }
    if(valid6(d.toritsugi||'')){
      const man=d6(d.toritsugi);
      put('申請取次・効果更新研修の申込',fixedFrom(minus(man,60),done,'tg_prep'),null,false,man);
      put('申請取次・届出満了日',fixedFrom(man,done,'tg_exp'),null);
    }
  }
  if(bizs.includes('後見')){
    if(valid_ymd8(d.bday||'')||valid_md4(d.bday||'')){
      const bm=(d.bday.length===8)?+d.bday.slice(4,6):+d.bday.slice(0,2);
      put('後見の定期報告',annualSeries(y=>new Date(y,bm,0),today,done,'koken',en.ts),KD_KOKEN);
    }
    put('年賀状の投函',annualSeries(y=>new Date(y,11,25),today,done,'nenga',en.ts),null);
    put('暑中見舞いの投函',annualSeries(y=>new Date(y,6,15),today,done,'shochu',en.ts),null);
  }
  (Array.isArray(d.dl)?d.dl:[]).forEach((x,i)=>{
    if(!valid6(x.d))return;
    const dt=d6(x.d);
    const kk='manual'+i+'_'+(x.n||'');
    if(x.r){
      const mm=dt.getMonth()+1,dd=dt.getDate();
      put(x.n||'手動期限',annualSeries(y=>new Date(y,mm-1,Math.min(dd,new Date(y,mm,0).getDate())),today,done,kk,en.ts),null);
    }else{
      put(x.n||'手動期限',fixedFrom(dt,done,kk),null);
    }
  });
  return out;
}
function allDeadlines(withDone){
  const today=kToday();
  KD_WITHDONE=!!withDone;
  const r=entries.filter(e=>e.cat==='kanri'&&!e.arch).flatMap(e=>kanriDeadlines(e,today));
  KD_WITHDONE=false;
  return r;
}
let kdOpen='';
function toggleKd(key){kdOpen=(kdOpen===key)?'':key;renderKanriDash()}
function kdDays(dt){return Math.round((dt-kToday())/86400000)}
let kdShowDone=false;
function toggleKdShowDone(){kdShowDone=!kdShowDone;renderKanriDash()}

    karteHtml='<div class="kd-title" style="margin-top:12px">顧客カルテ '+kartes.length+'件(タップで内容確認・編集)</div>'+kartes.map(e=>{
      const d=e.data||{};

      if(bz)bits.push('<span class="badge">'+esc(bz)+'</span>');
      if(valid_md4(d.kessan||''))bits.push('<span class="kd-date">決算 '+d.kessan.slice(0,2)+'/'+d.kessan.slice(2,4)+'</span>');
      if(valid6(d.kyoka||''))bits.push('<span class="kd-date">建設 '+iso6(d.kyoka)+'</span>');
      if(valid6(d.sanpai||''))bits.push('<span class="kd-date">産廃 '+iso6(d.sanpai)+'</span>');
      if(valid6(d.takken||''))bits.push('<span class="kd-date">宅建 '+iso6(d.takken)+'</span>');
      if(valid6(d.zexp||''))bits.push('<span class="kd-date">在留 '+iso6(d.zexp)+'</span>');
      if(valid_ymd8(d.bday||''))bits.push('<span class="kd-date">誕 '+d.bday.slice(0,4)+'-'+d.bday.slice(4,6)+'-'+d.bday.slice(6,8)+'</span>');
      if(Array.isArray(d.dl)&&d.dl.length)bits.push('<span class="kd-date">手動期限'+d.dl.length+'件</span>');
      return '<div class="kd-row" onclick="openDetail(\''+escAttr(String(e.id))+'\')"><div class="kd-main">'+bits.join('')+'</div></div>';
    }).join('');
  }
  const tglBtn='<button type="button" class="kd-toggle" onclick="event.stopPropagation();toggleKdShowDone()">'+(kdShowDone?'対応済みを隠す':'対応済みを表示')+'</button>';
  box.innerHTML='<div class="kd-title">期限ダッシュボード(全顧客・近い順)'+tglBtn+'</div>'+list.map(x=>{
    const days=kdDays(x.date);
    const cls=x.done?' kd-donerow':(x.over?(x.low?' kd-soon':' kd-over'):(days<=30?' kd-soon':''));
    const isStep=x.main&&(+x.main)!==(+x.date);
    const dtxt=x.done?'対応済':(x.over?('超過 '+(-days)+'日'):('あと '+days+'日'));
    let exp='';
    if(kdOpen===x.key){
      let st='';
      if(x.steps){
        st=x.steps.map(([n,label])=>{
          const sd=new Date(x.date);sd.setDate(sd.getDate()-n);
          return label+': '+dstr(sd);
        }).join(' → ');
        st='<div>'+esc(st)+'</div>';
      }
      const btn=x.done
        ?`<button type="button" class="kd-donebtn" onclick="event.stopPropagation();kdUndo('${escAttr(x.id)}','${escAttr(x.key)}','${escAttr(x.kind)}')">対応済みを取り消す(期限を復活)</button>`
        :`<button type="button" class="kd-donebtn" onclick="event.stopPropagation();kdDone('${escAttr(x.id)}','${escAttr(x.key)}','${escAttr(x.kind)}')">対応した(次回分に切替)</button>`;
      exp=`<div class="kd-exp">${st}${btn}</div>`;
    }
    return `<div class="kd-row${cls}" onclick="toggleKd('${escAttr(x.key)}')">
      <div class="kd-main"><span class="kd-days">${dtxt}</span><span class="kd-date num">${dstr(isStep?x.main:x.date)}</span><span class="kd-cust">${esc(x.cust)}</span><span class="kd-kind">${esc(x.kind)}</span>${isStep?`<span class="kd-sub num">(${dstr(x.date)})</span>`:''}</div>${exp}
    </div>`;
  }).join('')+karteHtml;

function kdUndo(id,key,label){
  askConfirm('「'+label+'」の対応済みを取り消して、期限を復活させますか?','取り消す',()=>{
    const e=entries.find(x=>String(x.id)===String(id));
    if(!e||!Array.isArray(e.data.doneKeys))return;
    e.data.doneKeys=e.data.doneKeys.filter(k=>k!==key);
    /* 対応時に作った履歴タスクはアーカイブへ退避 */
    entries.filter(x=>x.cat==='task'&&!x.arch&&x.data&&x.data.kdKey===key).forEach(x=>{
      x.arch=true;
      enqueue({action:'save',entry:x,cols:colsOf(x)},true);
    });
    saveLocal();
    enqueue({action:'save',entry:e,cols:colsOf(e)});
    kdOpen='';
    renderKanriDash();renderBanner();renderTimeline();
    toast('期限を復活させました(履歴は片付けました)');
  });
}
function kdDone(id,key,label){
  askConfirm('「'+label+'」を対応済みにしますか?(毎年ものは次回分の表示に切り替わります)','対応済みにする',()=>{
    const e=entries.find(x=>String(x.id)===String(id));
    if(!e)return;
    e.data.doneKeys=Array.isArray(e.data.doneKeys)?e.data.doneKeys:[];
    if(!e.data.doneKeys.includes(key))e.data.doneKeys.push(key);
    /* 履歴: 完了済みタスクとして下の一覧に残す */
    const dkey=String(key).split('@')[1]||'';
    const logNo=issueNo('task');
    const log={id:uid(),no:logNo,cat:'task',ts:Date.now(),data:{
      date:today6(),doneStat:'完了',doneDate:today6(),doneAt:nowStamp(),
      partner:(e.data&&e.data.partner)||'',
      prio:['不急'],
      content:'【期限対応】'+((e.data&&e.data.partner)||'')+' '+label+(dkey?'('+dkey+'分)':''),
      kdKey:key,doneKeys:[]}};
    entries.unshift(log);
    saveLocal();
    enqueue({action:'save',entry:e,cols:colsOf(e)});
    enqueue({action:'save',entry:log,cols:colsOf(log)});
    kdOpen='';
    renderKanriDash();renderBanner();renderTimeline();
    toast('対応済みにしました(履歴を記録)');
  });
}
function renderBanner(){
  const b=document.getElementById('kanriBanner');if(!b)return;
  const list=allDeadlines();
  const over=list.filter(x=>x.over&&!x.low).sort((a,b)=>a.date-b.date);
  const lowOver=list.filter(x=>x.over&&x.low);
  const soon=list.filter(x=>!x.over&&kdDays(x.date)<=30).sort((a,b)=>a.date-b.date);
  if(!over.length&&!soon.length&&!lowOver.length){b.style.display='none';b.className='';return}
  b.style.display='block';
  let main='';
  if(over.length){
    b.className='over';
    const o=over[0];
    main='⚠ 期限超過: '+over.length+'件'+(soon.length?('・30日以内: '+soon.length+'件'):'')+'(最優先: '+esc(o.cust)+' '+esc(o.kind)+' 超過'+(-kdDays(o.date))+'日) — タップで管理タブへ';
  }else if(soon.length){
    b.className='soon';
    const s0=soon[0];
    main='⚠ 期限30日以内: '+soon.length+'件(最短: '+esc(s0.cust)+' '+esc(s0.kind)+' 残り'+kdDays(s0.date)+'日) — タップで管理タブへ';
  }else{
    b.className='soon';
  }
  const sub=lowOver.length?('<div style="margin-top:'+(main?'4px':'0')+';font-size:.78rem;font-weight:400">四半期チェックの超過: '+lowOver.length+'件(急ぎではありません。ダッシュボードで消し込みを)</div>'):'';
  b.innerHTML=main+sub;
  b.onclick=()=>{
    guardLeave(()=>{activeCat='kanri';editingId=null;listLimit=20;renderTabs();renderFields();renderTimeline();window.scrollTo({top:0});});
  };
}
