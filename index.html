function catName(id){const c=catOf(id);return c?c.name:'(削除済みボタン)'}
function catColor(id){const c=catOf(id);return c?c.color:'#AAB0BA'}
function catFields(id){const c=catOf(id);return c?c.fields:[]}
function statlines(id){return catFields(id).filter(f=>f.type==='statline')}
function fmtAmt(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function fmtMin(m){if(!m)return'';return m>=60?(Math.floor(m/60)+'時間'+(m%60?m%60+'分':'')):m+'分'}

function entryValues(e){
  const vals=[];
  Object.values(e.data).forEach(v=>{
    if(v===''||v===undefined||v===null)return;
    if(Array.isArray(v)){if(v.length)vals.push(v.join(' '))}
    else vals.push(String(v));
  });
  return vals;
}
let urgOn=false,impOn=false,showDone=false,ankenFilter='',archOn=false,holdOn=false,billOn=false,payOn=false;
let seikyuAgg=null;
/* メモの内容欄から金額を読み取る(「55,000円」「5万円」「5万5000円」等。最初に見つかった金額を使う) */
function pfMoneyAmt(d){
  if(!d||!d.money)return 0;
  const t=String(d.content||'');
  let m=t.match(/(\d+(?:\.\d+)?)\s*万\s*([0-9][0-9,]*)?\s*円/);
  if(m)return Math.round(parseFloat(m[1])*10000)+(m[2]?(parseInt(m[2].replace(/,/g,''),10)||0):0);
  m=t.match(/([0-9][0-9,]*)\s*円/);
  if(m)return parseInt(m[1].replace(/,/g,''),10)||0;
  return 0;
}
/* 請求・入金の集計対象: 請求タブの記録+お金の記録つきメモ */
function moneyOf(e){
  const d=e.data||{};
  if(e.cat==='seikyu')return {bill:Number(d.billAmt)||0,pay:Number(d.payAmt)||0};
  if(e.cat==='pf'&&(d.money==='請求済み'||d.money==='入金済み')){
    const a=pfMoneyAmt(d);
    return d.money==='請求済み'?{bill:a,pay:0}:{bill:0,pay:a};
  }
  return null;
}
function buildSeikyuAgg(){
  const g={};const billedAnken=new Set();
  entries.forEach(e=>{
    if(e.arch)return;
    const mo=moneyOf(e);if(!mo)return;
    const d=e.data||{};
    const key=(typeof d.anken==='string'&&d.anken)?('A:'+d.anken):('R:'+e.id);
    if(!g[key])g[key]={bill:0,pay:0};
    g[key].bill+=mo.bill;
    g[key].pay+=mo.pay;
    if(mo.bill>0&&typeof d.anken==='string'&&d.anken)billedAnken.add(d.anken);
  });
  seikyuAgg={g:g,billedAnken:billedAnken};
}

function paintFilters(){
  const set=(id,on)=>{const el=document.getElementById(id);if(el)el.className='fbtn'+(on?' on':'')};
  set('fb_urg',urgOn);
  set('fb_imp',impOn);
  set('fb_done',showDone);
  set('fb_arch',archOn);
  set('fb_hold',holdOn);
  set('fb_anken',!!ankenFilter);
  set('fb_bill',billOn);
  set('fb_pay',payOn);
  const fa=document.getElementById('fb_anken');
  if(fa)fa.textContent=ankenFilter?('案件: '+ankenFilter.slice(0,8)+(ankenFilter.length>8?'…':'')):'案件';
}
function passFilters(e){
  const d=e.data||{};
  if(catFilter&&e.cat!==catFilter)return false;
  if(archOn){
    if(!e.arch)return false;
  }else{
    if(e.arch)return false;
    if(billOn||payOn){
      /* 回収モード(計算式): 未入金=案件単位で請求計>入金計の請求ログ・お金メモ / 未請求=完了済み案件で請求記録なし */
      let hit=false;
      if(payOn&&moneyOf(e)){
        const key=(typeof d.anken==='string'&&d.anken)?('A:'+d.anken):('R:'+e.id);
        const sm=(seikyuAgg&&seikyuAgg.g[key])||{bill:0,pay:0};
        if(sm.bill>sm.pay)hit=true;
      }
      if(!hit&&billOn&&e.cat==='anken'){
        if(d.doneStat==='完了'&&!(seikyuAgg&&seikyuAgg.billedAnken.has(ankenLabel(e))))hit=true;
      }
      if(!hit)return false;
    }else if(ankenFilter){
      /* 案件フィルター中: その案件本体+紐づく記録を、完了も含めて全部表示 */
      const linked=(e.cat==='anken'&&ankenLabel(e)===ankenFilter)||(typeof d.anken==='string'&&d.anken===ankenFilter);
      if(!linked)return false;
    }else if(holdOn){
      /* 保留庫: 保留だけを表示 */
      if(d.doneStat!=='保留')return false;
    }else{
      if(d.doneStat==='保留')return false;
      if(!showDone&&d.doneStat==='完了')return false;
    }
  }
  const p=Array.isArray(d.prio)?d.prio:[];
  if(urgOn&&!p.includes('緊急'))return false;
  if(impOn&&!p.includes('不急'))return false;
  return true;
}
const CAT_ORDER={task:1,kanri:2,jikan:3,shukan:4,pf:5,shushi:6,anken:7,seikyu:7.5,bukken:8,neta:9,hiyari:9.5,recipe:10,houjin:11,kojin:12,genkin:13};
function catOrderRel(e){
  if(e.cat===activeCat)return 0;
  return (CAT_ORDER[e.cat]||50)+1;
}
function doneRank(e){const st=(e.data||{}).doneStat;return st==='完了'?2:(st==='保留'?1:0)}
function sortForList(list){return list.sort((a,b)=>catOrderRel(a)-catOrderRel(b)||doneRank(a)-doneRank(b)||((b.ts||0)-(a.ts||0)))}
function matches(e,q){
  const hay=[catName(e.cat),e.no||'',...entryValues(e)].join(' ');
  return q.split(/[\s\u3000]+/).filter(Boolean).every(t=>{
    /* \u300cA-12\u300d\u5f62\u5f0f\u306f\u305d\u306e\u756a\u53f7\u306e1\u4ef6\u3060\u3051\u306b\u4e00\u81f4\u3055\u305b\u308b */
    if(/^[A-Za-z]-\d+$/.test(t))return String(e.no||'').toUpperCase()===t.toUpperCase();
    return hay.includes(t);
  });
}

function summaryHTML(e){
  const fs=catFields(e.cat);const d=e.data;
  let badges='';
  fs.filter(f=>f.type==='flags'&&Array.isArray(d[f.k])&&d[f.k].length).forEach(f=>{
    sortFlags(d[f.k].slice()).forEach(fv=>{
      if(fv==='なし'||fv==='基本'||fv==='不急')return; /* 不急はバッジを出さない(緊急だけ目立たせる) */
      if(fv==='緊急'){
        /* タップ1回+確認で緊急解除できるバッジ */
        badges+=`<span class="badge pa tapx" onclick="event.stopPropagation();unUrgent('${escAttr(String(e.id))}')">緊急 ✕</span>`;
        return;
      }
      const cls=fv==='重要'?' pb':'';
      badges+=`<span class="badge${cls}">${esc(fv)}</span>`;
    });
  });
  if(e.cat==='pf'&&d.money){
    if(d.money==='レシピ')badges+=`<span class="badge brecipe">レシピ</span>`;
    else badges+=`<span class="badge ${d.money==='入金済み'?'bgreen':'bred'}">${esc(d.money)} ${fmtAmt(pfMoneyAmt(d))}</span>`;
  }
  if(e.cat==='anken'&&!e.arch){
    const ln=ankenLinkInfo(ankenLabel(e)).n;
    if(ln)badges+=`<span class="badge">紐づけ${ln}</span>`;
  }
  if(Array.isArray(d.photos)&&d.photos.length)badges+=`<span class="badge">📷${d.photos.length}</span>`;
  statlines(e.cat).forEach(fd=>{
    const sv=d[fd.sk]||fd.options[0];
    const bcls=(sv===(fd.okv||fd.options[1]))?'bgreen':(sv==='保留'?'bgray':'bred');
    badges+=`<span class="badge ${bcls}">${esc(sv)}</span>`;
  });
  badges+=fs.filter(f=>f.type==='select'&&d[f.k]&&d[f.k]!=='未設定'&&f.k!=='io'&&f.k!=='money').map(f=>{
    const val=d[f.k];const lab=(f.labels&&f.labels[val])||val;
    return `<span class="badge">${esc(lab)}</span>`;
  }).join('');
  if(d.anken)badges+=`<span class="badge">${esc(String(d.anken).slice(0,14))}</span>`;
  if(d.bukkenref)badges+=`<span class="badge">${esc(String(d.bukkenref).slice(0,14))}</span>`;
  if(e.arch)badges+=`<span class="badge">アーカイブ</span>`;
  const persons=fs.filter(f=>f.type==='person'&&d[f.k]&&f.k!=='delegate').map(f=>d[f.k]);
  let parts=[];
  if(persons.length)parts.push(esc(persons.join(' / ')));
  if(d.amount!==''&&d.amount!==undefined){
    const cls=d.io==='収入'?'amt-in':(d.io==='支出'?'amt-out':'');
    const sign=d.io==='収入'?'＋':(d.io==='支出'?'−':'');
    parts.push(`<span class="num ${cls}">${sign}${fmtAmt(d.amount)}</span>`);
  }
  if(e.cat==='seikyu'){
    if(d.billAmt!==''&&d.billAmt!==undefined&&d.billAmt!==null)parts.push(`<span class="num">請求 ${fmtAmt(d.billAmt)}</span>`);
    if(d.payAmt!==''&&d.payAmt!==undefined&&d.payAmt!==null)parts.push(`<span class="num amt-in">入金 ${fmtAmt(d.payAmt)}</span>`);
  }
  if(d.minutes)parts.push(`<span class="num">${fmtMin(d.minutes)}</span>`);
  if(d.seconds!==''&&d.seconds!==undefined&&d.seconds!==null&&d.seconds!==0)parts.push(`<span class="num">${d.seconds}秒</span>`);
  const mainF=fs.find(f=>f.main&&['text','textarea','bigtext'].includes(f.type));
  const mainTxt=mainF?d[mainF.k]:(d.content||'');
  if(mainTxt)parts.push(esc(mainTxt));
  return {badges,line:parts.join('　')};
}
function visibleList(){
  /* v61: ふだんは選択中タブの記録だけ表示。検索・案件・未請求・未入金のときは全タブ横断 */
  const q=document.getElementById('searchBox').value.trim();
  const tabScoped=!q&&!ankenFilter&&!billOn&&!payOn;
  return sortForList(entries.filter(passFilters).filter(e=>!tabScoped||e.cat===activeCat).filter(e=>!q||matches(e,q)));
}
function renderTimeline(){
  buildSeikyuAgg();

    let sb=0,sp=0;
    entries.forEach(x=>{
      if(x.arch)return;const xd=x.data||{};

    });

      const g=document.createElement('div');g.className='seikyu-sum';
      g.innerHTML='請求計 ¥'+sb.toLocaleString('ja-JP')+'　入金計 ¥'+sp.toLocaleString('ja-JP')+'　<span class="'+(zan>0?'zan-red':'zan-ok')+'">差額 ¥'+zan.toLocaleString('ja-JP')+'</span>';

  }

    const rows=[];let tot=0,freeZan=0,freeN=0;

      if(zan<=0)return;
      if(k.indexOf('A:')===0){rows.push({name:k.slice(2),zan:zan});tot+=zan}

      head.style.cssText='font-weight:700;margin-bottom:4px';
      head.innerHTML='未回収 '+(rows.length+freeN)+'件 <span class="zan-red num">合計 ¥'+(tot+freeZan).toLocaleString('ja-JP')+'</span> <span style="font-weight:400;font-size:.76rem;color:var(--sub)">タップで内訳を表示</span>';
      g.appendChild(head);

        row.onclick=()=>{ankenFilter=r.name;listLimit=20;paintFilters();renderTimeline();window.scrollTo({top:0})};
        g.appendChild(row);
      });

        row.textContent='案件に未紐づけの請求 ¥'+freeZan.toLocaleString('ja-JP')+'('+freeN+'件)';
        g.appendChild(row);
      }
      el.appendChild(g);
    }
  }
  const list=visibleList();
  if(!list.length){el.innerHTML='<div class="empty-timeline">このタブに表示できる記録がありません(検索すると全タブから探せます。完了分は「完了を含む」、保留分は「保留」で表示されます)</div>';renderBanner();renderKanriDash();return}
  const shown=list.slice(0,listLimit);
  shown.forEach(e=>{
    try{
    const s=summaryHTML(e);
    const d=document.createElement('div');d.className='rec';
    d.innerHTML=`<div class="tabmark" style="background:${catColor(e.cat)}"></div>
      <div class="body">
        <div class="meta"><span class="cat">${esc(catName(e.cat))}</span><span class="num">${fmt6(e.data.date)}</span>${e.no?`<span class="num" style="font-size:.68rem">${esc(e.no)}</span>`:''}${s.badges}</div>
        <span class="txt">${s.line||'(内容なし)'}</span>
      </div>`;
    d.onclick=()=>openDetail(e.id);
    if(canQuickDone(e)){
      const qb=document.createElement('button');
      qb.className='qdone';qb.type='button';
      qb.innerHTML='<span>✓</span>完了';
      qb.onclick=ev=>{ev.stopPropagation();quickDone(e.id)};
      d.appendChild(qb);
    }
    el.appendChild(d);
    }catch(err){console.error('表示スキップ',e&&e.id,err)}
  });
  if(list.length>shown.length){
    const m=document.createElement('button');
    m.className='morebtn';
    m.textContent='さらに表示(残り '+(list.length-shown.length)+' 件)';
    m.onclick=()=>{listLimit+=50;renderTimeline()};
    el.appendChild(m);
  }
  renderBanner();renderKanriDash();
}

    if(f.type==='flags'){

      if(!arr.length)return'';

        ?`<span style="font-size:.9rem;color:var(--sub)">なし</span>`
        :x==='不急'

    }

      return `<div class="dl"><div class="k">${f.label}</div><div class="v">

        ${dspan}</div></div>`;
    }
    if(f.type==='photos')return''; /* 写真は下でまとめて表示 */
    let v=e.data[f.k];
    if(v===''||v===undefined||v===null)return'';
    if(Array.isArray(v)){if(!v.length)return'';v=v.join('、')}
    if(f.type==='amount')v=fmtAmt(v);
    if(f.type==='minutes')v=fmtMin(v);
    if(f.type==='seconds')v=v+'秒';
    if(f.type==='date6o')v=iso6(v)||v;
    if(f.type==='time4')v=fmt4(v)||v;
    if(f.type==='md4')v=(typeof v==='string'&&v.length===4)?v.slice(0,2)+'/'+v.slice(2,4):v;
    if(f.type==='ymd8')v=(typeof v==='string'&&v.length===8)?v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8):v;
    if(f.type==='unitnum')v=v+(f.unit||'');
    if(f.type==='deadlist')v=(v||[]).map(x=>x.n+'('+(iso6(x.d)||x.d)+(x.r?'・毎年':'')+')').join('、');
    if(f.type==='select'&&f.labels&&f.labels[v])v=f.labels[v]+'('+v+')';
    return `<div class="dl"><div class="k">${f.label.replace(/(＋.*)/,'').trim()}</div><div class="v">${esc(v)}</div></div>`;
  }).join('');
  if(e.data&&e.data.mergedInto){
    b.innerHTML+=`<div class="dl"><div class="k">統合先</div><div class="v">${esc((e.data.mergedIntoNo?e.data.mergedIntoNo+'　':'')+e.data.mergedInto)}</div></div>`;
  }
  if(Array.isArray(e.data.photos)&&e.data.photos.length){
    const wrap=document.createElement('div');wrap.className='dl';
    wrap.innerHTML='<div class="k">写真</div>';
    e.data.photos.forEach(pid=>{
      const im=document.createElement('img');
      im.className='dphoto';im.alt='読み込み中…';
      wrap.appendChild(im);
      loadPhoto(pid).then(d=>{
        if(d)im.src=d;
        else im.alt='写真を読み込めませんでした(送信待ちの可能性。電波のある所で開き直してください)';
      });
    });
    b.appendChild(wrap);
  }
  const acts=document.getElementById('detailActions');
  if(e.arch){
    let abtns='<button onclick="copyOne()">この1件をコピー</button><button onclick="unarchiveOne()">一覧に戻す</button>';
    if(e.cat!=='anken')abtns+='<button class="danger" onclick="hardDeleteOne()">完全削除</button>';
    acts.innerHTML=abtns;
  }else{
    let btns='<button onclick="copyOne()">この1件をコピー</button><button onclick="editOne()">編集する</button>';
    if(e.cat==='anken')btns+='<button onclick="mergeAnkenStart()">別の案件にまとめる</button>';
    if(e.data&&e.data.anken&&e.cat!=='anken')btns+='<button onclick="jumpToAnken()">紐づく案件を開く</button>';
    btns+='<button class="danger" onclick="archiveOne()">アーカイブ</button>';
    acts.innerHTML=btns;
  }
  document.getElementById('detailOverlay').classList.add('open');
}
function jumpToAnken(){
  const cur=entries.find(x=>String(x.id)===String(detailId));
  if(!cur||!cur.data||!cur.data.anken)return;
  const t=entries.find(x=>x.cat==='anken'&&!x.arch&&ankenLabel(x)===cur.data.anken)
    ||entries.find(x=>x.cat==='anken'&&ankenLabel(x)===cur.data.anken);
  if(!t){toastErr('紐づく案件が見つかりません(案件の内容や相手方が後から変わった可能性があります)');return}
  openDetail(t.id);
}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('open')}
function entryText(e){
  const lines=['【'+catName(e.cat)+'】'+(e.no?e.no+'　':'')+iso6(e.data.date)];
  catFields(e.cat).filter(f=>f.k!=='date').forEach(f=>{
    if(f.type==='statline'){
      const sv=e.data[f.sk]||f.options[0];
      lines.push(f.label+': '+sv);
      if(f.dk&&e.data[f.dk])lines.push(f.dlabel.replace('(6桁)','')+': '+iso6(e.data[f.dk]));
      return;
    }
    let v=e.data[f.k];
    if(f.type==='photos'){if(Array.isArray(v)&&v.length)lines.push('写真: '+v.length+'枚');return}
    if(v===''||v===undefined||v===null)return;
    if(Array.isArray(v)){if(!v.length)return;v=v.join('、')}
    if(f.type==='amount')v=fmtAmt(v);
    if(f.type==='minutes')v=fmtMin(v);
    if(f.type==='seconds')v=v+'秒';
    if(f.type==='date6o')v=iso6(v)||v;
    if(f.type==='time4')v=fmt4(v)||v;
    if(f.type==='md4')v=(typeof v==='string'&&v.length===4)?v.slice(0,2)+'/'+v.slice(2,4):v;
    if(f.type==='ymd8')v=(typeof v==='string'&&v.length===8)?v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8):v;
    if(f.type==='unitnum')v=v+(f.unit||'');
    if(f.type==='deadlist')v=(v||[]).map(x=>x.n+'('+(iso6(x.d)||x.d)+(x.r?'・毎年':'')+')').join('、');
    lines.push(f.label.replace(/[(（][^)）]*[)）]/g,'').replace(/(＋.*)/,'').trim()+': '+v);
  });
  return lines.join('\n');
}
function copyOne(){const e=entries.find(x=>x.id===detailId);copyText(entryText(e),'1件コピーしました')}
function editOne(){
  const e=entries.find(x=>x.id===detailId);
  guardLeave(()=>{
    activeCat=e.cat;editingId=e.id;
    renderTabs();renderFields(e.data);closeDetail();
    window.scrollTo({top:0});
    toast('修正して保存してください');
  });
}
function canQuickDone(e){
  if(e.arch)return false;
  const fd=statlines(e.cat).find(f=>f.sk==='doneStat');
  if(!fd)return false;
  return ((e.data||{}).doneStat||fd.options[0])!=='完了';
}
function unUrgent(id){
  askConfirm('緊急を解除していいですか?(区分は「不急」になります)','解除する',()=>{
    const e=entries.find(x=>String(x.id)===String(id));
    if(!e)return;
    const d=e.data||(e.data={});
    d.prio=['不急'];
    saveLocal();
    enqueue({action:'save',entry:e,cols:colsOf(e)});
    renderTimeline();
    toast('緊急を解除しました');
  });
}
function quickDone(id){
  askConfirm('この記録を「完了」にしますか?','完了にする',()=>{
    const e=entries.find(x=>String(x.id)===String(id));
    if(!e)return;
    const d=e.data||(e.data={});
    d.doneStat='完了';
    if(!d.doneDate)d.doneDate=today6();
    if(!d.doneAt)d.doneAt=nowStamp();
    saveLocal();
    enqueue({action:'save',entry:e,cols:colsOf(e)});
    renderTimeline();
    toast('完了にしました');
  });
}
function archiveOne(){
  const id=detailId;
  askConfirm('この記録をアーカイブしますか?(一覧から見えなくなりますが、データは残ります)','アーカイブする',()=>{
    const e=entries.find(x=>String(x.id)===String(id));
    if(!e)return;
    e.arch=1;
    saveLocal();
    enqueue({action:'save',entry:e,cols:colsOf(e)});
    closeDetail();renderTimeline();toast('アーカイブしました(フィルターの「アーカイブ」で見られます)');
  });
}
function unarchiveOne(){
  const e=entries.find(x=>String(x.id)===String(detailId));
  if(!e)return;
  delete e.arch;
  saveLocal();
  enqueue({action:'save',entry:e,cols:colsOf(e)});
  closeDetail();renderTimeline();toast('一覧に戻しました');
}
function hardDeleteOne(){
  const id=detailId;
  const tgt=entries.find(x=>String(x.id)===String(id));
  if(tgt&&tgt.cat==='anken'){toastErr('案件は完全削除できません(紐づけ保護のため、アーカイブまでにしています)');return}
  askConfirm('完全に削除しますか?(元に戻せません)','完全削除する',()=>{
    entries=entries.filter(x=>String(x.id)!==String(id));
    saveLocal();
    enqueue({action:'delete',id:id});
    closeDetail();renderTimeline();toastErr('完全に削除しました');
  });
}
function copyAll(){
  const q=document.getElementById('searchBox').value.trim();
  const list=visibleList();
  if(!list.length){toastErr('コピーする記録がありません');return}
  askConfirm(q?`検索結果 ${list.length}件をコピーしますか?`:`全 ${list.length}件をコピーしますか?`,'コピーする',()=>{
    const text=list.map(entryText).join('\n----------------------------------------\n');
    copyText(text,q?`検索結果 ${list.length}件をコピーしました`:`全 ${list.length}件をコピーしました`);
  });
}
function copyText(t,msg){
  navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();toast(msg);
  });
}

/* ============== その他 ============== */
let toastTimer=null;
function toast(msg,bad){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.toggle('err',!!bad);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),4000);
}
function toastErr(msg){toast(msg,true)}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escAttr(s){return esc(s).replace(/"/g,'&quot;')}

(function(){
  const ec=document.getElementById('entrycard');
  if(ec){
    ['input','change','click','focusin','keydown','touchstart'].forEach(ev=>{
      ec.addEventListener(ev,()=>{lastTouch=Date.now();saveDraft()},true);
    });
  }
})();
(function(){
  const sb=document.getElementById('searchBox');
  let bypass=false;
  sb.addEventListener('focus',()=>{
    if(bypass){bypass=false;return}
    if(needGuard()){
      sb.blur();
      askConfirm('区分を選んでいません。保存されていませんが、次の画面に行っていいですか?','移動する',()=>{bypass=true;sb.focus();});
    }
  });
})();
(function(){
  const host=document.getElementById('fields');
  if(host){
    const isOne=t=>t&&t.classList&&t.classList.contains('oneline');
    host.addEventListener('pointerdown',e=>{if(isOne(e.target))e.target.classList.add('expanded')},true);
    host.addEventListener('input',e=>{if(isOne(e.target))e.target.classList.add('expanded')},true);
    host.addEventListener('focusout',e=>{if(isOne(e.target))e.target.classList.remove('expanded')},true);
  }
})();
document.getElementById('appVer').textContent=APP_VER;
loadLocal();
migrate();
renderTabs();
if(!restoreDraft())renderFields(); /* 入力途中の下書きがあれば復元 */
setTimeout(renderTimeline,0);
updStat();
if(!apiKey){showKeyScreen('初回設定です');updStat('未接続');}
else{fetchAll();}
window.addEventListener('online',()=>{flush();imgFlush();if(apiKey){fetchRetry=0;fetchAll();}});
document.addEventListener('visibilitychange',()=>{
  /* スマホでアプリに戻ってきた時、30秒以上経っていれば最新データを取り直す */
  if(document.visibilityState==='visible'&&apiKey&&Date.now()-lastFetchOk>30000){fetchRetry=0;fetchAll();}
});
setInterval(()=>{flush();imgFlush()},30000);
imgFlush();
</script>
